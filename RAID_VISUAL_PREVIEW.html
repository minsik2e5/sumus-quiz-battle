<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SUMUS RAID V0.9.3C.3 Visual Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 30% 0,#123e78,#030918 48%,#01040b);color:#f7f4e9;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif}header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid #d9ae59;background:#031022f2}h1{margin:0;color:#ffe17b;font:900 24px Georgia,serif}header p{margin:3px 0 0;color:#82a8c7;font-size:11px}.tabs{display:flex;gap:8px;margin-left:auto}button{height:38px;padding:0 16px;border:1px solid #4e7192;background:#071a32;color:#d8eaff;font-weight:900;cursor:pointer;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}button.active{border-color:#ffe17b;background:#124b91;color:#fff3ba;box-shadow:0 0 16px #27bfff55}main{display:grid;place-items:center;padding:22px}.pane{display:none;width:min(100%,1500px)}.pane.active{display:grid;place-items:center}.frame{overflow:hidden;border:1px solid #d9ae59;background:#020713;box-shadow:0 25px 80px #000c}.teacher img{display:block;width:100%;height:auto}.student .frame{width:360px;max-width:100%}.student img{display:block;width:100%;height:auto}.note{max-width:820px;margin:16px auto 0;padding:11px 14px;border-left:3px solid #43d7ff;background:#07182c;color:#aac3d8;font-size:12px;line-height:1.6}@media(max-width:620px){header{position:static;display:block}.tabs{margin:12px 0 0}main{padding:10px}}
  </style>
</head>
<body>
  <header><div><h1>SUMUS RAID V0.9.3C.3</h1><p>DEDICATED RAID SHELL · ACTUAL RUNTIME CAPTURE</p></div><nav class="tabs"><button class="active" data-target="student">STUDENT 360×667</button><button data-target="teacher">TEACHER 24</button></nav></header>
  <main>
    <section class="pane student active" id="student"><div class="frame"><img src="qa/v0.9.3c3/student-raid-360x667.jpg" alt="SUMUS RAID student runtime"></div><p class="note">100dvh RAID 전용 학생 Shell. 전투, 1–4 선택지, ATTACK TIME, PASS가 스크롤 없이 한 화면에 유지됩니다.</p></section>
    <section class="pane teacher" id="teacher"><div class="frame"><img src="qa/v0.9.3c3/teacher-raid-24-1366x768.jpg" alt="SUMUS RAID teacher runtime"></div><p class="note">16:9 RAID 전용 방송 Shell. 실제 24명 카드가 4열 × 6행으로 한 화면에 표시됩니다.</p></section>
  </main>
  <script>document.querySelectorAll('[data-target]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-target]').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.pane').forEach(pane=>pane.classList.toggle('active',pane.id===button.dataset.target));}));</script>
</body>
</html>
