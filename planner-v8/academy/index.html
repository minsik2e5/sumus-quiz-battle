<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173D2B"><title>썸어스학원 관리시스템</title></head><body><div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:40px;text-align:center;color:#4e5968">썸어스학원 관리시스템 불러오는 중...</div><script>(async()=>{try{const v='20260909a';const parts=await Promise.all(['part1.txt','part2.txt','part3.txt'].map(x=>fetch(x+'?v='+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()})));const b=parts.join('').trim();const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replace('</head>','<link rel="stylesheet" href="academy-v2.css?v='+v+'"></head>');html=html.replace('</body>','<script src="academy-v2-loader.js?v='+v+'"><\/script></body>');document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div style="font-family:sans-serif;padding:40px;text-align:center">사이트 로딩에 실패했습니다.<br><button onclick="location.reload()" style="margin-top:16px;padding:10px 16px">다시 불러오기</button></div>';console.error(e)}})();</script></body></html>
