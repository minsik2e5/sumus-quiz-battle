<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f9"><title>SUMUS Academy OS</title></head><body><div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:40px;text-align:center;color:#4e5968">SUMUS Academy OS 불러오는 중...</div><script>(async()=>{const parts=await Promise.all(['part1.txt','part2.txt','part3.txt'].map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()})));const b=parts.join('').trim();const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();})().catch(e=>{document.body.innerHTML='<div style="font-family:sans-serif;padding:40px">사이트 로딩에 실패했습니다. 새로고침해주세요.</div>';console.error(e)});</script></body></html>
