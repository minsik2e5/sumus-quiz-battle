<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6">
<title>SUMUS 한국사 모바일 빈칸노트</title>
<style>
:root{
  --bg:#f2f4f6;--card:#fff;--text:#191f28;--sub:#6b7684;--line:#e5e8eb;
  --blue:#3182f6;--blue2:#1b64da;--blueSoft:#eaf3ff;--green:#00a67d;--red:#f04452;
  --shadow:0 8px 26px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
body{min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button,input{font:inherit}
button{cursor:pointer}

.app{width:100%;max-width:760px;margin:0 auto;padding:8px 10px 22px}
.header{padding:5px 3px 8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#3182f6,#69a8ff);color:white;
display:grid;place-items:center;font-weight:900;box-shadow:0 7px 18px rgba(49,130,246,.22)}
.brand h1{font-size:16px;margin:0;font-weight:900;letter-spacing:-.45px}
.brand p{font-size:10px;color:var(--sub);margin:2px 0 0}

.sticky{position:sticky;top:0;z-index:20;background:rgba(242,244,246,.95);backdrop-filter:blur(12px);padding:5px 0 7px}
.mode-card{background:#fff;border-radius:17px;padding:8px;box-shadow:var(--shadow)}
.mode-title{font-size:10px;color:#8b95a1;font-weight:800;margin:0 0 5px 2px}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#f2f4f6;border-radius:13px;padding:3px}
.ver{border:0;background:transparent;border-radius:10px;padding:7px 3px;color:#6b7684;font-weight:850;font-size:11px}
.ver small{display:block;font-size:8px;margin-top:1px;color:#9aa3ad;font-weight:700}
.ver.active{background:white;color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ver.active small{color:#73a0df}

.chapter-scroll{display:flex;gap:6px;overflow:auto;scrollbar-width:none;padding:8px 1px 2px;-webkit-mask-image:linear-gradient(to right,#000 0,#000 92%,transparent 100%);mask-image:linear-gradient(to right,#000 0,#000 92%,transparent 100%)}
.chapter-scroll::-webkit-scrollbar{display:none}
.chapter{border:0;background:#fff;color:#6b7684;border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:11px;font-weight:850;
box-shadow:0 3px 10px rgba(0,0,0,.035)}
.chapter.active{background:#191f28;color:#fff}

.hero{background:#fff;border-radius:21px;padding:17px 15px 14px;margin-top:6px;box-shadow:var(--shadow)}
.hero .eyebrow{font-size:10px;color:var(--blue);font-weight:900;margin-bottom:5px}
.hero h2{font-size:22px;line-height:1.24;letter-spacing:-.7px;margin:0 0 5px}
.hero p{font-size:12px;color:var(--sub);line-height:1.5;margin:0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.badge{font-size:10px;background:#f7f8fa;color:#6b7684;font-weight:800;padding:7px 9px;border-radius:999px}

.note{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border:1.5px solid transparent;border-radius:18px;padding:13px 13px 12px;box-shadow:var(--shadow);transition:.18s ease}
.row.focused{border-color:#8dbbff;background:#fbfdff;box-shadow:0 8px 24px rgba(49,130,246,.12)}
.keyword{color:#3567a8;font-weight:900;font-size:12px;margin-bottom:6px}
.body{font-size:15px;line-height:1.78;font-weight:560;letter-spacing:-.2px;word-break:keep-all}
.blank{display:inline-flex;align-items:center;vertical-align:middle;min-width:64px;max-width:145px;margin:0 2px;border-bottom:2px solid #a8c9fb;white-space:nowrap}
.blank:focus-within{border-bottom-color:#3182f6;border-bottom-width:3px}
.blank input{width:100%;min-width:60px;max-width:145px;border:0;outline:0;background:transparent;text-align:center;padding:1px 2px 2px;
font-size:15px;font-weight:850;color:#1b64da}
.blank input::placeholder{color:transparent}
.blank input.ok{color:var(--green)}
.blank input.no{color:var(--red)}
.answer-show{color:#e14c58;font-weight:900}
.masked-clue{display:inline-block;min-width:44px;height:1.05em;margin:0 2px;vertical-align:-.04em;border-bottom:2px solid #d8dee8;color:transparent;user-select:none}

.progress-card{background:#fff;border-radius:18px;padding:13px 14px;margin-top:12px;box-shadow:var(--shadow)}
.progress-top{display:flex;justify-content:space-between;font-size:11px;color:#6b7684;font-weight:800;margin-bottom:8px}
.track{height:8px;background:#edf0f2;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#3182f6,#65a8ff);border-radius:999px;transition:.25s}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
border-top:1px solid #eceff1;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bottom-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.btn{border:0;border-radius:14px;padding:13px 8px;font-size:12px;font-weight:900}
.btn:disabled{opacity:.42;cursor:default}
.btn.soft{background:#f2f4f6;color:#4e5968}
.btn.primary{background:var(--blue);color:white}
.btn.dark{background:#191f28;color:white}

.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%) translateY(15px);background:#191f28;color:white;
padding:11px 14px;border-radius:13px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:40;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.typing .header,body.typing .sticky,body.typing .hero{display:none}
body.typing .app{padding-top:6px}
body.typing .note{margin-top:0}
body.typing .bottom-inner{grid-template-columns:1fr}
body.typing #answerBtn,body.typing #resetBtn{display:none}
body.typing .row:not(.focused){opacity:.72}
body.typing .progress-card{display:none}

@media(min-width:680px){
  .app{padding-top:18px}
  .row{display:grid;grid-template-columns:145px 1fr;align-items:start}
  .keyword{margin:3px 14px 0 0;font-size:13px}
  .body{border-left:1px solid #edf0f2;padding-left:18px}
  .hero{padding:26px 24px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>SUMUS HISTORY</h1>
        <p>핸드폰용 필기형 빈칸 복습</p>
      </div>
    </div>
  </header>

  <div class="sticky">
    <div class="mode-card">
      <div class="mode-title">빈칸 버전</div>
      <div class="segment">
        <button class="ver active" data-v="1">VERSION 1<small>핵심어</small></button>
        <button class="ver" data-v="2">VERSION 2<small>세부사항</small></button>
        <button class="ver" data-v="3">VERSION 3<small>종합</small></button>
      </div>
    </div>
    <div class="chapter-scroll" id="chapters"></div>
  </div>

  <section class="hero">
    <div class="eyebrow" id="eyebrow">VERSION 1 · 핵심어</div>
    <h2 id="title"></h2>
    <p id="desc">필기 내용을 읽으면서 비어 있는 핵심 내용을 직접 채워보세요.</p>
    <div class="meta">
      <span class="badge" id="blankCount">빈칸 0개</span>
    </div>
  </section>

  <section class="note" id="note"></section>

  <section class="progress-card">
    <div class="progress-top"><span id="status">0개 작성</span><span id="score">채점 전</span></div>
    <div class="track"><div class="bar" id="bar"></div></div>
  </section>
</div>

<div class="bottom">
  <div class="bottom-inner">
    <button class="btn soft" id="answerBtn">정답 보기</button>
    <button class="btn soft" id="resetBtn">다시 쓰기</button>
    <button class="btn primary" id="checkBtn">채점하기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

const $=id=>document.getElementById(id);
function k(s,v,r,p){return `s${s}v${v}r${r}p${p}`}
function norm(s){return String(s||"").replace(/\s+/g,"").replace(/[·.,/\-]/g,"").toLowerCase()}
function activeAnswersForSection(){
  const answers=[];
  DATA[section].rows.forEach(row=>row[1].forEach(part=>{
    const ans=part[1], vers=part[2];
    if(ans && vers.includes(version)) answers.push(ans);
  }));
  return [...new Set(answers)].sort((a,b)=>b.length-a.length);
}
function containsAnswer(text, answers){
  const n=norm(text);
  return answers.some(a=>n.includes(norm(a)) || norm(a).includes(n) && n.length>=3);
}
function appendMaskedText(parent,text,answers){
  let segments=[{text:String(text),masked:false}];
  answers.forEach(ans=>{
    const next=[];
    segments.forEach(seg=>{
      if(seg.masked){next.push(seg);return}
      let remaining=seg.text;
      let idx=remaining.indexOf(ans);
      if(idx<0){next.push(seg);return}
      while(idx>=0){
        if(idx>0) next.push({text:remaining.slice(0,idx),masked:false});
        next.push({text:ans,masked:true});
        remaining=remaining.slice(idx+ans.length);
        idx=remaining.indexOf(ans);
      }
      if(remaining) next.push({text:remaining,masked:false});
    });
    segments=next;
  });
  segments.forEach(seg=>{
    if(seg.masked){
      const m=document.createElement("span");
      m.className="masked-clue";
      m.textContent=seg.text;
      parent.appendChild(m);
    }else{
      parent.appendChild(document.createTextNode(seg.text));
    }
  });
}
function right(a,v){
  if(norm(a)===norm(v))return true;
  const aliases={
    "대한민국 임시정부":["대한민국임시정부","임시정부"],
    "민족자결주의":["민족자결"],
    "2·8독립선언":["28독립선언","2.8독립선언"],
    "도평의회·부면협의회":["도평의회부면협의회"],
    "검열·삭제·정간·폐간":["검열삭제정간폐간"],
    "이상설·이동휘":["이상설이동휘"],
    "민립대학설립운동":["민립대학운동"],
    "노동·농민 운동":["노동농민운동"]
  };
  return (aliases[a]||[]).some(x=>norm(x)===norm(v));
}
function save(){localStorage.setItem("sumus_history_mobile_v4",JSON.stringify(saved))}
function buildChapters(){
  const wrap=$("chapters");wrap.innerHTML="";
  DATA.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="chapter"+(i===section?" active":"");
    b.textContent=`${i+1}. ${SAFE_SHORTS[i]}`;
    b.onclick=()=>{section=i;showAnswers=false;render();window.scrollTo({top:0,behavior:"smooth"})};
    wrap.appendChild(b);
  });
  requestAnimationFrame(()=>{
    const active=wrap.querySelector(".chapter.active");
    if(active) wrap.scrollTo({left:Math.max(0,active.offsetLeft-wrap.clientWidth/2+active.clientWidth/2),behavior:"smooth"});
  });
}
function render(){
  buildChapters();
  document.querySelectorAll(".ver").forEach(b=>b.classList.toggle("active",+b.dataset.v===version));
  const s=DATA[section];
  const pageAnswers=activeAnswersForSection();
  $("title").textContent=SAFE_TITLES[section];
  $("eyebrow").textContent=version===1?"VERSION 1 · 핵심 개념":
                              version===2?"VERSION 2 · 인물·장소·세부":
                              "VERSION 3 · 종합 고난도";
  const note=$("note");note.innerHTML="";
  let total=0,filled=0,correct=0,checked=0;

  s.rows.forEach((row,ri)=>{
    const card=document.createElement("article");card.className="row";
    const kw=document.createElement("div");kw.className="keyword";
    kw.textContent=containsAnswer(row[0],pageAnswers)?"핵심 내용":row[0];
    const body=document.createElement("div");body.className="body";

    row[1].forEach((part,pi)=>{
      const [txt,ans,vers]=part;
      if(ans && vers.includes(version)){
        total++;
        if(showAnswers){
          const span=document.createElement("span");span.className="answer-show";span.textContent=ans;body.appendChild(span);
        }else{
          const span=document.createElement("span");span.className="blank";
          const inp=document.createElement("input");
          const id=k(section,version,ri,pi);
          inp.dataset.answer=ans;inp.dataset.key=id;inp.placeholder="";
          inp.autocomplete="off";inp.autocapitalize="off";inp.spellcheck=false;inp.enterKeyHint="next";
          inp.value=saved[id]?.value||"";
          if(inp.value.trim())filled++;
          if(saved[id]?.checked){
            checked++;
            if(saved[id].correct)correct++;
            inp.classList.add(saved[id].correct?"ok":"no");
          }
          const width=Math.min(145,Math.max(64,ans.length*14+22));
          inp.style.width=width+"px";
          inp.addEventListener("input",()=>{
            inp.classList.remove("ok","no");
            saved[id]={value:inp.value,checked:false,correct:false};
            save();updateLive();
          });
          inp.addEventListener("focus",()=>{
            document.body.classList.add("typing");
            document.querySelectorAll(".row.focused").forEach(x=>x.classList.remove("focused"));
            card.classList.add("focused");
            setTimeout(()=>card.scrollIntoView({block:"center",behavior:"smooth"}),120);
          });
          inp.addEventListener("blur",()=>{
            setTimeout(()=>{
              if(!document.querySelector("#note input:focus")){
                document.body.classList.remove("typing");
                card.classList.remove("focused");
              }
            },120);
          });
          inp.addEventListener("keydown",e=>{
            if(e.key==="Enter"){
              e.preventDefault();
              const all=[...document.querySelectorAll("#note input")];
              const pos=all.indexOf(inp);
              if(pos>=0 && pos<all.length-1) all[pos+1].focus();
              else inp.blur();
            }
          });
          span.appendChild(inp);body.appendChild(span);
        }
      } else {
        appendMaskedText(body,txt,pageAnswers);
      }
    });
    card.appendChild(kw);card.appendChild(body);note.appendChild(card);
  });

  $("blankCount").textContent=`빈칸 ${total}개`;
  $("status").textContent=showAnswers?"정답 확인 중":`${filled} / ${total} 작성`;
  $("score").textContent=checked?`${correct} / ${checked} 정답`:"채점 전";
  $("bar").style.width=(total?Math.round(filled/total*100):0)+"%";
  $("answerBtn").textContent=showAnswers?"문제로 돌아가기":"정답 보기";
  $("answerBtn").disabled=!showAnswers && checked===0;
  const perfect=total>0 && checked===total && correct===total;
  $("checkBtn").dataset.next=perfect?"1":"0";
  $("checkBtn").textContent=perfect?(section===DATA.length-1?"처음 단원으로":"다음 단원 →"):"채점하기";
}
function updateLive(){
  const inputs=[...document.querySelectorAll("#note input")];
  const total=inputs.length;
  const filled=inputs.filter(x=>x.value.trim()).length;
  $("status").textContent=`${filled} / ${total} 작성`;
  $("bar").style.width=(total?Math.round(filled/total*100):0)+"%";
}
function check(){
  if($("checkBtn").dataset.next==="1"){
    section=(section+1)%DATA.length;showAnswers=false;document.body.classList.remove("typing");render();window.scrollTo({top:0,behavior:"smooth"});return;
  }
  if(showAnswers){showAnswers=false;render();return}
  const inputs=[...document.querySelectorAll("#note input")];
  let c=0;
  inputs.forEach(inp=>{
    const ok=right(inp.dataset.answer,inp.value);
    inp.classList.remove("ok","no");inp.classList.add(ok?"ok":"no");
    saved[inp.dataset.key]={value:inp.value,checked:true,correct:ok};
    if(ok)c++;
  });
  save();
  $("score").textContent=`${c} / ${inputs.length} 정답`;
  $("answerBtn").disabled=false;
  if(c===inputs.length){
    $("checkBtn").dataset.next="1";
    $("checkBtn").textContent=section===DATA.length-1?"처음 단원으로":"다음 단원 →";
  }
  toast(c===inputs.length?"전부 맞았어요. 다음 단원으로 넘어가세요.":`${inputs.length-c}개 다시 확인해보세요.`);
}
function reset(){
  if(!resetArmed){
    resetArmed=true;
    $("resetBtn").textContent="정말 지울까요?";
    toast("한 번 더 누르면 이 단원의 답이 지워져요.");
    clearTimeout(resetTimer);
    resetTimer=setTimeout(()=>{resetArmed=false;$("resetBtn").textContent="다시 쓰기"},2600);
    return;
  }
  resetArmed=false;clearTimeout(resetTimer);
  [...document.querySelectorAll("#note input")].forEach(inp=>{
    delete saved[inp.dataset.key];inp.value="";inp.classList.remove("ok","no");
  });
  save();render();toast("이 단원의 답을 모두 지웠어요.");
}
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),1500);
}
document.querySelectorAll(".ver").forEach(b=>b.onclick=()=>{
  version=+b.dataset.v;showAnswers=false;render();toast(`VERSION ${version}`);
});
$("answerBtn").onclick=()=>{
  if($("answerBtn").disabled){toast("먼저 채점해보세요.");return}
  showAnswers=!showAnswers;render();
};
$("resetBtn").onclick=reset;
$("checkBtn").onclick=check;
render();
</script>
</body>
</html>
