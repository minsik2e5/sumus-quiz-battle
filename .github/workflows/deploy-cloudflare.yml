# Secrets configured for production deploy
name: Deploy Cloudflare

on:
  push:
    branches: [sumus-voca-prod-deploy]
  workflow_dispatch:

concurrency:
  group: sumus-voca-cloudflare-production
  # Queue instead of cancelling: killing a run mid-deploy can leave the
  # Worker updated but the secret sync / smoke test skipped.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VOCA_STATE_SECRET: ${{ secrets.VOCA_STATE_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:assets
      # Never ship without the full release suite, even on a direct push.
      - run: npm run check
      - run: npm run check:cloudflare
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)
          test -n "$VOCA_STATE_SECRET" || (echo "Missing VOCA_STATE_SECRET repository secret" && exit 1)
      - name: Verify VOCA state secret fingerprint
        shell: bash
        run: |
          actual="$(printf '%s' "$VOCA_STATE_SECRET" | sha256sum | awk '{print $1}')"
          expected="81336e5a06fcd1381eb4e828715636773142660f792073648a5fb2e81f410e53"
          if [ "$actual" != "$expected" ]; then
            echo "VOCA_STATE_SECRET does not match the Supabase state secret."
            exit 1
          fi

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
      # Re-applies the same secret as a safety net (its value is verified by the fingerprint
      # step above). Cloudflare refuses it while a Workers Builds preview version of another
      # branch is the newest upload; that must not skip the smoke test, so warn instead.
      - name: Sync durable-state secret
        shell: bash
        run: |
          if ! printf '%s' "$VOCA_STATE_SECRET" | npx wrangler secret put VOCA_STATE_SECRET; then
            echo "::warning::VOCA_STATE_SECRET was not re-applied (a newer preview version exists). The deployed Worker keeps its current secret; the smoke test below checks it."
          fi

      # V13.129: HTTP 200만 보지 않고, 새 버전(package.json)이 실제로 올라가 ok:true인지 본다(첫 시작은 느릴 수 있어 1분까지 기다림).
      - name: Smoke test deployed API
        shell: bash
        run: |
          base="https://sumus-voca.minsik2e5.workers.dev"
          want="$(node -p "require('./package.json').version")"
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/health.json -w "%{http_code}" "$base/api/health" || true)"
            echo "health attempt $i -> HTTP $code (want $want)"
            cat /tmp/health.json || true
            echo
            if [ "$code" = "200" ] && node -e "const h = require('/tmp/health.json'); process.exit(h.ok === true && h.version === process.argv[1] ? 0 : 1)" "$want"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deployed API did not report ok:true with version $want"
          exit 1
