# SUMUS 수업관리 플래너 (planner/) — deployed on its own branch, separate from VOCA.
name: Deploy Planner

on:
  push:
    branches: [sumus-planner-deploy]
  workflow_dispatch:

concurrency:
  group: sumus-planner-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node planner/check.mjs
      - name: Deploy planner Worker
        run: npx wrangler deploy -c planner/wrangler.jsonc
      - name: Smoke test
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' https://sumus-planner.minsik2e5.workers.dev/api/auth)" && [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "planner /api/auth did not answer 200"; exit 1
