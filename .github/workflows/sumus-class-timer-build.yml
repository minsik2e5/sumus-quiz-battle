name: Build SUMUS Class Timer
on:
  push:
    branches: [sumus-class-timer-build-v15]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rebuild source ZIP
        shell: pwsh
        run: |
          $parts = Get-ChildItem "sumus-class-timer-build/chunk_*" | Sort-Object Name
          $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join '') -replace '\s',''
          [IO.File]::WriteAllBytes("sumus-class-timer-build/source-fixed.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "sumus-class-timer-build/source-fixed.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "c2488873941022c674e497c5b4416868c81ae855dce38c673f660bcd6a115314") { throw "Source ZIP checksum mismatch: $hash" }

      - name: Extract source
        shell: pwsh
        run: Expand-Archive -Path "sumus-class-timer-build/source-fixed.zip" -DestinationPath "timer-src" -Force

      - name: Publish Windows single EXE
        shell: pwsh
        run: |
          dotnet publish "timer-src/SUMUS_Class_Timer/SUMUS_Class_Timer.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o "release"
          if (!(Test-Path "release/SUMUS_Class_Timer.exe")) { throw "SUMUS_Class_Timer.exe was not produced." }

      - name: Prepare simple package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item "release/SUMUS_Class_Timer.exe" "package/SUMUS_Class_Timer.exe"
          @"
          SUMUS CLASS TIMER

          사용법:
          SUMUS_Class_Timer.exe 를 더블클릭하면 바로 실행됩니다.
          설치나 별도 프로그램은 필요하지 않습니다.
          "@ | Set-Content -Path "package/README.txt" -Encoding UTF8
          Compress-Archive -Path "package/*" -DestinationPath "SUMUS_Class_Timer_V1_Stable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SUMUS_Class_Timer_V1_Stable
          path: |
            package/SUMUS_Class_Timer.exe
            package/README.txt
            SUMUS_Class_Timer_V1_Stable.zip
          if-no-files-found: error
