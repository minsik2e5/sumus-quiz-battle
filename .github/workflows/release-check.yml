name: Release check

on:
  pull_request:
    branches: [cloudflare-voca]
  push:
    branches: [cloudflare-voca]

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:assets
      - run: npm run check
      - run: npm run check:load
      - run: npm run check:cloudflare
