<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<title>단체 줄넘기 — SUMUS ISLAND</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0b2a4a;--gold:#f2c14e;--gold2:#d9a21b;--muted:#6b7c93;--line:#dde5ee;--red:#e2364f;--green:#1fb36b;--yellow:#f5a524;--blue:#3d9bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;height:100dvh;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#1b1538;color:#13233a;overscroll-behavior:none;overflow:hidden;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;border:0;cursor:pointer}
.hidden{display:none!important}

/* ── 입장 화면 (PART 2 와 같은 모양) ── */
#join{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(#3b2a6b,#d9705a 62%,#f4b26a)}
.jbox{width:100%;max-width:380px;background:#fff;border-radius:24px;border:5px solid var(--gold);box-shadow:0 8px 0 var(--gold2);padding:22px 20px}
.jbox h1{margin:0;font-size:13px;font-weight:800;color:var(--muted)}
.jbox h2{margin:2px 0 14px;font-size:22px;font-weight:900;color:var(--navy)}
.jbox label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 6px}
.jbox input{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:20px;font-weight:800;outline:none;font-family:inherit}
.jbox input:focus{border-color:var(--gold)}
#pinIn{letter-spacing:6px;text-align:center;font-size:28px}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--navy);box-shadow:0 0 0 3px #fff inset}
.jgo{margin-top:18px;width:100%;padding:16px;border-radius:16px;background:var(--navy);color:#fff;font-weight:900;font-size:19px}
.jgo:disabled{opacity:.6}
.jerr{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.conn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--yellow)}.conn.ok i{background:var(--green)}.conn.bad i{background:var(--red)}

/* ── 게임 화면 ── */
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#1b1538;color:#fff;touch-action:none;padding-top:env(safe-area-inset-top)}
.top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--navy);border-bottom:3px solid var(--gold);z-index:3}
.me{display:flex;align-items:center;gap:7px;min-width:0;background:rgba(255,255,255,.1);border-radius:999px;padding:5px 12px 5px 5px;font-weight:900;font-size:15px}
.me i{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid #fff}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me b{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.me b.ok{background:var(--green)}.me b.bad{background:var(--red)}
#hearts{margin-left:auto;display:flex;gap:2px;font-size:22px;line-height:1}
#hearts span{color:#ff4d6d;text-shadow:0 2px 0 rgba(0,0,0,.25);transition:color .2s,opacity .2s}
#hearts span.off{color:rgba(255,255,255,.22);text-shadow:none}
#hearts span.broke{animation:hbreak .7s ease-out}
@keyframes hbreak{0%{transform:scale(1.6);color:#ff4d6d}30%{transform:scale(1.2) rotate(-18deg)}60%{transform:scale(.9) rotate(12deg)}100%{transform:none}}
#muteBtn{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:17px;display:grid;place-items:center}
#hearts:empty+#muteBtn{margin-left:auto}

#scene{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:8px;right:8px;top:8px;display:flex;align-items:flex-start;gap:6px;pointer-events:none}
.chip{background:rgba(11,42,74,.72);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-weight:900;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.chip em{font-style:normal;opacity:.8}
#scoreBox{margin-left:auto;text-align:right;background:rgba(11,42,74,.72);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:4px 10px;font-weight:900;line-height:1.15}
#score{font-size:18px;color:var(--gold);display:block}
#combo{font-size:12px;font-style:normal;opacity:.95;display:block;min-height:14px}
#combo.pulse{animation:cpulse .35s ease-out}
@keyframes cpulse{0%{transform:scale(1.5);color:#ffe15a}100%{transform:none}}

.layer{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
#banner{top:22%;opacity:0}
#banner div{display:inline-block;background:rgba(11,42,74,.78);border:3px solid var(--gold);border-radius:18px;padding:8px 18px;font-weight:900;font-size:min(7.2vw,30px);box-shadow:0 6px 0 rgba(0,0,0,.25)}
#banner small{display:block;font-size:.5em;opacity:.85;font-weight:800;margin-top:2px}
#banner.show{animation:bannerA 2.1s ease-out forwards}
@keyframes bannerA{0%{opacity:0;transform:translateY(-14px) scale(.85)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#count{top:26%;font-weight:900;font-size:min(30vw,140px);line-height:1;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25),0 0 30px rgba(255,200,90,.6)}
#count.tick{animation:countA .9s ease-out}
#count.go{color:#ffe15a;font-size:min(20vw,92px)}
@keyframes countA{0%{transform:scale(1.6);opacity:0}15%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.85}}
#fx{top:16%;font-weight:900;font-size:min(13vw,60px);line-height:1;opacity:0;-webkit-text-stroke:2px rgba(0,0,0,.25)}
#fx.pop{animation:fxA .95s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes fxA{0%{opacity:0;transform:scale(.4) rotate(-6deg)}18%{opacity:1;transform:scale(1.12) rotate(2deg)}32%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-18px) scale(.96)}}
#fx.perfect{color:#ffd84d;text-shadow:0 4px 0 #b9770a,0 0 24px rgba(255,216,77,.85)}
#fx.pass{color:#5cf09a;text-shadow:0 4px 0 #0d7a40}
#fx.fail{color:#ff5d73;text-shadow:0 4px 0 #8c1426}
#fx.shield{color:#8fd0ff;text-shadow:0 4px 0 #1d5d9b}
#fx.clear{color:#fff;text-shadow:0 4px 0 #b9770a,0 0 26px rgba(255,230,120,.9)}
#fxSub{top:calc(16% + min(13vw,60px) + 6px);font-weight:900;font-size:min(5.6vw,24px);opacity:0;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#fxSub.pop{animation:subA 1.1s ease-out forwards}
@keyframes subA{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#comboFx{top:44%;font-weight:900;font-size:min(9vw,40px);opacity:0}
#comboFx.pop{animation:comboA 1.2s ease-out forwards}
#comboFx.c1{color:#ffb84d;text-shadow:0 3px 0 #7a3c00}
#comboFx.c2{color:#ff7ad1;text-shadow:0 3px 0 #6a0f4c,0 0 18px #ff7ad1;font-size:min(11vw,50px)}
#comboFx.c3{background:linear-gradient(90deg,#ff5d73,#ffd84d,#5cf09a,#5ab8ff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:min(12.5vw,56px);filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
@keyframes comboA{0%{opacity:0;transform:scale(.3) rotate(8deg)}20%{opacity:1;transform:scale(1.15)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,70,.15),rgba(255,30,60,.55))}
#flash.on{animation:flashA .55s ease-out}
#flash.gold{background:radial-gradient(ellipse at center,rgba(255,230,120,.35),rgba(255,200,60,0) 70%)}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}
#specTag{bottom:10px}
#specTag span{display:inline-block;background:rgba(11,42,74,.82);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;font-weight:900;font-size:15px}
#lobbyCard{top:46px;padding:0 12px}
#lobbyCard .card{display:inline-block;max-width:400px;background:rgba(11,42,74,.84);border:3px solid var(--gold);border-radius:20px;padding:12px 16px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#lobbyCard h3{margin:0 0 6px;font-size:min(6.4vw,26px);font-weight:900;text-align:center;color:#ffe15a}
#lobbyCard ol{margin:0;padding-left:20px;font-weight:800;font-size:min(3.9vw,15.5px);line-height:1.5}
#lobbyCard p{margin:6px 0 0;text-align:center;font-weight:800;font-size:13px;opacity:.85}
#netBanner{top:50%;transform:translateY(-50%)}
#netBanner span{display:inline-block;background:rgba(196,42,67,.92);border-radius:14px;padding:10px 16px;font-weight:900;font-size:16px}
#outOv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(20,60,120,.35),rgba(10,20,50,.7))}
#outOv.show{animation:outA 2.6s ease-out forwards}
#outOv b{display:block;font-size:min(18vw,84px);font-weight:900;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.3)}
#outOv span{font-weight:800;font-size:17px}
@keyframes outA{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}

#pad{flex:0 0 40%;display:flex;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#6b4423,#4a2e17);border-top:4px solid #2e1c0c;position:relative}
#pad::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.0) 0 22px,rgba(0,0,0,.18) 22px 24px);pointer-events:none}
#jumpBtn{position:relative;flex:1;border-radius:30px;overflow:hidden;background:linear-gradient(#ffe27a,#f2b51e 70%,#e39b0b);color:#3a2300;box-shadow:0 12px 0 #a76a00,0 14px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .06s,box-shadow .06s,filter .15s;touch-action:none;margin-bottom:12px}
#jumpBtn .lbl{position:relative;font-weight:900;font-size:min(17vw,88px);line-height:1;letter-spacing:2px;text-shadow:0 3px 0 rgba(255,255,255,.55)}
#jumpBtn small{position:relative;font-weight:800;font-size:min(4.2vw,17px);opacity:.75;margin-top:8px}
#jumpBtn .bar{position:absolute;left:14px;right:14px;bottom:12px;height:10px;border-radius:99px;background:rgba(90,50,0,.25);overflow:hidden}
#jumpBtn .bar i{position:absolute;inset:0;background:#fff;border-radius:99px;transform-origin:left center;transform:scaleX(1)}
#jumpBtn.wait{filter:saturate(.55) brightness(.9)}
#jumpBtn.wait .bar i{background:#ffefb5}
#jumpBtn.down{transform:translateY(9px);box-shadow:0 3px 0 #a76a00,0 4px 8px rgba(0,0,0,.3)}
#jumpBtn.nudge{animation:nudge .25s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#jumpBtn.spec{background:linear-gradient(#5d6b85,#3e4a62);color:#dfe8f5;box-shadow:0 12px 0 #262f40}
#jumpBtn.spec .lbl{font-size:min(10vw,48px);text-shadow:none}
#jumpBtn.spec .bar{display:none}
#jumpBtn.practice small{opacity:.9}
#jumpBtn.ready{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 12px 0 #a76a00,0 0 26px rgba(255,226,122,.75)}}

#cheer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#cheer span{position:absolute;font-size:30px;animation:cheerA 1.2s ease-out forwards}
@keyframes cheerA{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-180px) scale(1.2)}}

/* ── 끝 화면 ── */
#endv{position:fixed;inset:0;z-index:8;overflow:auto;display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));background:rgba(15,10,40,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ebox{width:100%;max-width:400px;background:#fff;border-radius:24px;border:5px solid var(--gold);box-shadow:0 8px 0 var(--gold2);padding:20px 18px;text-align:center;color:var(--navy);animation:eIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes eIn{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.ebox .k{font-size:13px;font-weight:800;color:var(--muted)}
.ebox .rank{font-size:min(17vw,72px);font-weight:900;line-height:1.05;margin:4px 0}
.ebox .rank small{font-size:.32em;color:var(--muted);font-weight:800}
.ebox .st{display:inline-block;border-radius:999px;padding:6px 14px;font-weight:900;font-size:15px;color:#fff}
.ebox .msg{font-weight:900;font-size:19px;margin:12px 0 4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.grid div{background:#f3f6fa;border-radius:14px;padding:9px 6px}
.grid b{display:block;font-size:22px;font-weight:900}
.grid span{font-size:12.5px;font-weight:800;color:var(--muted)}
.top3{margin-top:12px;text-align:left;font-weight:800;font-size:14px}
.top3 div{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px}
.top3 div.mine{background:#fff4cf}
.top3 i{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
.top3 em{margin-left:auto;font-style:normal;color:var(--muted)}
.ebox .note{margin-top:14px;font-size:13.5px;font-weight:800;color:var(--muted)}
</style>
</head>
<body>
<section id="join">
  <div class="jbox">
    <h1>SUMUS ISLAND · PART 3</h1>
    <h2>단체 줄넘기</h2>
    <label for="pinIn">방 번호</label>
    <input id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    <label for="nameIn">이름</label>
    <input id="nameIn" maxlength="8" autocomplete="off" placeholder="최대 8글자">
    <label>캐릭터 색</label>
    <div class="sw" id="sw"></div>
    <button class="jgo" id="joinBtn">입장하기</button>
    <div class="jerr" id="jerr"></div>
    <div class="conn" id="conn"><i></i><span>서버 연결 중…</span></div>
  </div>
</section>

<section id="game" class="hidden">
  <header class="top">
    <div class="me"><i id="meDot"></i><span id="meName"></span><b id="netDot" class="ok"></b></div>
    <div id="hearts"></div>
    <button id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>
  </header>
  <div id="scene">
    <canvas id="cv"></canvas>
    <div class="hud"><div class="chip" id="stageChip">대기실</div><div id="scoreBox"><b id="score">0</b><em id="combo"></em></div></div>
    <div class="layer" id="lobbyCard"><div class="card">
      <h3>곧 시작해요!</h3>
      <ol><li>두 거인이 큰 줄을 돌려요</li><li>줄이 발밑으로 올 때 <b style="color:#ffe15a">점프</b>를 톡!</li><li>줄이 땅을 칠 때 공중에 있으면 통과</li></ol>
      <p id="modeLine">아래 버튼으로 연습해 보세요</p>
    </div></div>
    <div class="layer" id="banner"><div></div></div>
    <div class="layer" id="count"></div>
    <div class="layer" id="fx"></div>
    <div class="layer" id="fxSub"></div>
    <div class="layer" id="comboFx"></div>
    <div id="flash"></div>
    <div id="outOv"><div><b>탈락!</b><span id="outSub">바다로 퐁당~</span></div></div>
    <div class="layer hidden" id="specTag"><span>👀 관전 중 · 친구들을 응원해요</span></div>
    <div class="layer hidden" id="netBanner"><span>연결 끊김 — 다시 연결 중…</span></div>
  </div>
  <div id="pad"><button id="jumpBtn"><span class="lbl">점프!</span><small id="btnSub">줄이 발밑에 올 때 톡!</small><span class="bar"><i id="barFill"></i></span></button></div>
</section>
<div id="cheer"></div>
<section id="endv" class="hidden"></section>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/jr-common.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const COLORS = ['#ff4d6d', '#3d7bff', '#22c55e', '#ffb020', '#a855f7', '#14b8a6', '#f97316', '#ec4899', '#64748b', '#0ea5e9'];
const LS = 'sumus-island-player'; // 세 게임이 같이 쓰는 저장소 → 수업 방에서 넘어와도 같은 학생
const LS_MUTE = 'sumus-island-mute';
let saved = {}; try { saved = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { saved = {}; }
const qs = new URLSearchParams(location.search);
const urlPin = qs.get('pin');
$('#pinIn').value = urlPin || '';
$('#nameIn').value = saved.name || '';
let color = COLORS.includes(saved.color) ? saved.color : COLORS[Math.floor(Math.random() * COLORS.length)];
$('#sw').innerHTML = COLORS.map(c => `<button style="background:${c}" data-c="${c}" class="${c === color ? 'on' : ''}" aria-label="색 선택"></button>`).join('');
$('#sw').onclick = (e) => { const c = e.target.dataset.c; if (!c) return; color = c; document.querySelectorAll('#sw button').forEach(b => b.classList.toggle('on', b.dataset.c === c)); };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const socket = io();
const clock = IQ.makeClock(socket);
let logN = 0;
const report = (msg) => { try { if (++logN > 15) return; socket.emit('clientlog', { msg: 'jr ' + String(msg).slice(0, 280), ua: navigator.userAgent.slice(0, 160), pin: $('#pinIn').value }); } catch (e) {} };
addEventListener('error', (e) => report('error: ' + e.message + ' @' + (e.lineno || '')));
addEventListener('unhandledrejection', (e) => report('rejection: ' + (e.reason && e.reason.message || e.reason)));
// 모든 이벤트 처리기를 감싸서 하나가 실패해도 화면이 멈추지 않게
const on = (ev, fn) => socket.on(ev, (...a) => { try { fn(...a); } catch (e) { report(ev + ': ' + (e && e.stack || e)); } });

const setConn = (c, t) => { $('#conn').className = 'conn ' + c; $('#conn span').textContent = t; $('#netDot').className = c; $('#netBanner').classList.toggle('hidden', c !== 'bad' || !joined); };
const t0 = Date.now();
socket.on('connect', () => setConn('ok', '서버 연결됨'));
socket.on('connect_error', () => setConn('bad', Date.now() - t0 < 70000 ? '서버 깨우는 중… (처음엔 최대 1분)' : '서버에 연결할 수 없습니다'));
socket.on('disconnect', () => setConn('bad', '연결 끊김 — 다시 연결 중…'));

/* ── 상태 ── */
let me = null, joined = false, retries = 0;
let phase = { phase: 'none', mode: 'out' };
let roster = new Map();
let plan = null, prevPlan = null;            // 지금 단계, 직전 단계 (줄 그리기)
let AIR = 0.56, REST = 0.18;                 // 최신 jr:plan 값
const airByStage = {};
let lastTs = -1e15, myJumps = [];            // 내가 뛴 시각(서버 시계)
let pendingAt = 0, pendingTimer = 0;         // 조금 일찍 누른 점프 예약
let myCombo = 0;
let invUntil = 0;                            // 하트 모드 보호(서버 시각)
let ouchAt = -1e15;                          // 걸려서 휘청(서버 시각)
let fallAt = 0;                              // 탈락해서 바다로 떨어지기 시작한 시각(performance)
let happyAt = -1e15;
let readyAtSrv = 0, readyAtLocal = 0, lastCount = '';
let bannerAt = 0, bannerPlan = null;
let lastTickT = 0;
let muted = false; try { muted = localStorage.getItem(LS_MUTE) === '1'; } catch (e) {}

function activePlan(t) {
  if (plan && t > plan.start) return plan;
  if (prevPlan && prevPlan.hits.length && t < prevPlan.hits[prevPlan.hits.length - 1] + 30) return prevPlan;
  return plan;
}
function meX() { return W / 2; }

/* ── 그리기 루프 ── */
let splashFor = 0, shake = 0, lastFrame = performance.now(), barKey = -1, ready = false;
function frame() {
  requestAnimationFrame(frame);
  if (!joined || document.hidden) return;
  try { draw(); } catch (e) { report('draw ' + (e && e.stack || e)); }
}
function draw() {
  const pnow = performance.now(), dt = Math.min(0.05, (pnow - lastFrame) / 1000); lastFrame = pnow;
  const now = clock.now(), ts = pnow / 1000, ph = phase.phase;
  if (pendingAt && now >= pendingAt) firePending();
  // 단계 안내
  if (bannerAt && now >= bannerAt && bannerPlan && $('#count').textContent) bannerAt = now + 120; // 카운트다운과 겹치지 않게
  if (bannerAt && now >= bannerAt && bannerPlan) {
    const pl = bannerPlan; bannerAt = 0;
    const b = $('#banner'); b.firstChild.innerHTML = `${pl.final ? 'FINAL · ' : ''}STAGE ${pl.stage}<small>${pl.name} · ${pl.n}번 넘기</small>`;
    b.firstChild.style.borderColor = JR.stageColor(pl.stage); restart(b, 'show'); sfx('banner');
    $('#stageChip').innerHTML = `STAGE ${pl.stage}/${pl.stages} <em>· ${pl.name}</em>`; $('#stageChip').style.borderColor = JR.stageColor(pl.stage);
  }
  // 카운트다운
  const cEl = $('#count');
  if (ph === 'ready' || (ph === 'play' && lastCount && lastCount !== 'done')) {
    const remain = ph === 'play' ? -1 : (clock.ready && readyAtSrv ? readyAtSrv - now : readyAtLocal - pnow);
    let txt = remain > 3000 ? '준비!' : remain > 0 ? String(Math.ceil(remain / 1000)) : '점프!';
    if (ph === 'play' && lastCount === '점프!' && cEl._goAt && pnow - cEl._goAt > 900) txt = 'done';
    if (txt !== lastCount) {
      lastCount = txt;
      if (txt === 'done') { cEl.textContent = ''; }
      else { cEl.textContent = txt; cEl.classList.toggle('go', txt === '점프!'); restart(cEl, 'tick'); if (txt === '점프!') { cEl._goAt = pnow; sfx('go'); buzz(60); } else if (txt !== '준비!') { sfx('count'); buzz(25); } }
    }
  } else if (cEl.textContent && ph !== 'ready') { cEl.textContent = ''; lastCount = ph === 'play' ? 'done' : ''; }

  // 줄 상태
  const pl = clock.ready ? activePlan(now) : null;
  const sw = JR.swing(pl, now);
  const theta = sw.theta, idle = sw.idle;
  // 땅 치는 순간: 틱 소리 + 먼지
  if (pl && clock.ready) {
    let lastHit = 0; for (const h of pl.hits) { if (h <= now) lastHit = h; else break; }
    if (lastHit > lastTickT) { if (now - lastHit < 150) { sfx('tick'); dust(W / 2, G); shake = Math.max(shake, 0.18); } lastTickT = lastHit; }
  }
  // 내 점프 상태
  const out = isOut();
  const jh = JR.jumpH(lastTs, AIR, now), sq = JR.squash(lastTs, AIR, REST, now);
  const u = (now - lastTs) / (AIR * 1000);
  // 버튼 회복 표시
  const cd = (AIR + REST) * 1000 - 25, rec = Math.max(0, Math.min(1, (now - lastTs) / cd));
  const rk = out || ph === 'end' ? -2 : Math.round(rec * 50);
  if (rk !== barKey) { barKey = rk; $('#barFill').style.transform = `scaleX(${rk < 0 ? 1 : rec.toFixed(3)})`; btn.classList.toggle('wait', rk >= 0 && rk < 50); btn.classList.toggle('ready', rk === 50 && ph === 'play' && !out); }

  // ── 장면 ──
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  let ox = 0, oy = 0;
  if (shake > 0.01) { ox = (Math.random() - 0.5) * shake * CH * 0.22; oy = (Math.random() - 0.5) * shake * CH * 0.16; shake *= Math.exp(-dt * 9); } else shake = 0;
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.translate(ox, oy);
  // 반짝이는 물결
  ctx.fillStyle = 'rgba(255,225,170,.35)';
  for (let i = 0; i < 10; i++) { const y = HORIZON + (BACK - HORIZON) * ((i * 0.37) % 1), x = ((i * 97 + ts * (12 + i * 3)) % (W + 60)) - 30; ctx.fillRect(x, y, 14 + (i % 3) * 8, 1.5); }
  // 바다에 빠진 친구들
  for (const o of others) if (o.out) drawFloater(o.x, o.y, CH * 0.13, o.color, ts, o.seed, false);
  // 나도 빠졌으면
  let fallP = fallAt ? Math.min(1, (pnow - fallAt) / 1100) : 1;
  const seaX = W * 0.78, seaY = HORIZON + (BACK - HORIZON) * 0.62;
  if (out && fallP >= 1) drawFloater(seaX, seaY, CH * 0.2, me.color, ts, 1, true);
  // 거인 + 줄 (뒤)
  const front = JR.ropeInFront(theta);
  const lh = drawGiant(-1, theta, ts), rh = drawGiant(1, theta, ts);
  if (!idle) ropeShadow(theta);
  const drawRopes = () => {
    if (!idle && pl && sw.swingMs && sw.swingMs < 1400) { // 빠를 때 잔상
      const s1 = JR.swing(pl, now - 22), s2 = JR.swing(pl, now - 44);
      if (!s2.idle) drawRope(s2.theta, false, ts, 0.18);
      if (!s1.idle) drawRope(s1.theta, false, ts, 0.35);
    }
    drawRope(theta, idle, ts, 1, lh, rh);
  };
  if (!front) drawRopes();
  // 친구들
  const air = AIR;
  for (const o of others) {
    if (o.out) continue;
    const j = lastJ.get(o.id);
    const lift = j != null ? JR.jumpH(j, air, now) * CH * 0.5 * (o.s / S) : Math.max(0, Math.sin(ts * 3 + o.seed)) * 0;
    drawMini(o, lift, ts);
  }
  // 나
  if (!out || (fallAt && fallP < 1)) {
    const x = meX();
    let y = G, sx = 1, sy = 1, rot = 0, arm = 0, face = 'smile', tuck = 0, alpha = null;
    if (jh > 0) {
      y = G - jh * CH * 0.62;
      const st = u < 0.12 ? 1 + 0.18 * (u / 0.12) : u < 0.4 ? 1.18 - 0.18 * ((u - 0.12) / 0.28) : u > 0.85 ? 1 + 0.08 * ((u - 0.85) / 0.15) : 1;
      sy = st; sx = 1 / Math.sqrt(st); arm = Math.min(1, u * 4) * (u > 0.8 ? (1 - u) * 5 : 1); tuck = Math.sin(Math.PI * u); face = 'o';
    } else if (sq > 0) { sy = 1 - 0.2 * sq; sx = 1 + 0.14 * sq; }
    else if (now - lastTs < 0) { /* 미래 시각(시계 보정 직후) — 서 있는 자세 */ }
    if (now - happyAt < 900) face = 'happy';
    if (now - ouchAt < 650 && now - ouchAt >= 0) { face = 'ouch'; rot = Math.sin((now - ouchAt) / 650 * Math.PI * 3) * 0.18 * (1 - (now - ouchAt) / 650); }
    if (fallAt && fallP < 1) { // 뒤로 날아가 바다에 퐁당
      const k = fallP, ex = seaX, ey = seaY;
      y = G + (ey - G) * k - Math.sin(Math.PI * k) * CH * 1.1; rot = k * 5.5; face = 'ouch';
      const sc = 1 - 0.75 * k; sx = sy = sc;
      ctx.save(); ctx.translate(x + (ex - x) * k, 0);
      drawJumper(0, y, S, me.color, ts, { seed: me.name || me.color, sx, sy, rot, arm: 1, face, tuck: 0.6 });
      ctx.restore();
    } else {
      // 그림자
      const sh = 1 - jh * 0.45;
      ctx.fillStyle = 'rgba(40,15,25,.32)'; ctx.beginPath(); ctx.ellipse(x, G, S * 0.6 * sh, S * 0.18 * sh, 0, 0, 7); ctx.fill();
      // 보호막 (하트 모드에서 걸린 뒤 1.8초)
      if (invUntil > now) alpha = Math.floor(now / 110) % 2 ? 0.45 : 1;
      drawJumper(x, y, S, me.color, ts, { seed: me.name || me.color, sx, sy, rot, arm, face, tuck, alpha });
      if (invUntil > now) { ctx.strokeStyle = `rgba(120,200,255,${0.4 + 0.3 * Math.sin(now / 80)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, y - CH * 0.5, CH * 0.55, CH * 0.62, 0, 0, 7); ctx.stroke(); }
      // 내 표시
      ctx.fillStyle = '#ffe15a'; const ty = y - CH * 1.12 - 6 + Math.sin(ts * 4) * 2;
      ctx.beginPath(); ctx.moveTo(x - 7, ty - 9); ctx.lineTo(x + 7, ty - 9); ctx.lineTo(x, ty); ctx.closePath(); ctx.fill();
    }
  }
  if (fallAt && fallP >= 1 && splashFor !== fallAt) { splashFor = fallAt; if (pnow - fallAt < 2000) { burst(seaX, seaY, 30, PAL_SEA, 0.8, 600); sfx('splash'); } }
  if (front) drawRopes();
  drawHand(lh); drawHand(rh);
  // 줄이 땅을 칠 때 반짝
  if (!idle && pl) {
    const near = Math.min(Math.abs(sw.hitIn), Math.abs(now - (sw.k > 0 ? pl.hits[sw.k - 1] : -1e15)));
    if (near < 70) { ctx.fillStyle = `rgba(255,240,200,${(0.5 * (1 - near / 70)).toFixed(3)})`; ctx.beginPath(); ctx.ellipse(W / 2, G, (HXR - HXL) * 0.4, CH * 0.06, 0, 0, 7); ctx.fill(); }
  }
  // 파티클
  for (const p of parts) {
    if (p.life <= 0) continue;
    p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  // 관전 표시 갱신 (탈락 연출이 끝나면)
  if (out && fallAt && pnow - fallAt > 2400 && $('#specTag').classList.contains('hidden') && (ph === 'play' || ph === 'ready')) renderUI();
}
requestAnimationFrame(frame);
</script>
