<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>try { if (!sessionStorage.getItem('sumus-sess')) location.replace('/'); } catch (e) { location.replace('/'); }</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMUS ISLAND PART 3 — 단체 줄넘기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0b2a4a;--gold:#f2c14e;--gold2:#d9a21b;--muted:#6b7c93;--line:#dde5ee;--red:#e2364f;--green:#1fb36b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#2a2350;color:#13233a}
button{font:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.chip{background:rgba(11,42,74,.86);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:clamp(13px,1.2vw,21px);display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip b{color:var(--gold)}
.chip.stg{color:#13233a}
.chip.warn{background:rgba(226,54,79,.92)}
#hudL{position:fixed;left:20px;top:18px;display:flex;gap:8px;z-index:5;flex-wrap:wrap;max-width:46vw}
#hudR{position:fixed;right:18px;top:18px;display:flex;gap:8px;z-index:5}
.ibtn{width:42px;height:42px;border-radius:12px;background:rgba(11,42,74,.7);color:#fff;font-size:17px;display:grid;place-items:center}
#ctrl{position:fixed;left:20px;bottom:18px;display:flex;gap:8px;z-index:6}
.btn{padding:11px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn.ghost{background:rgba(255,255,255,.82)}
.btn.gold{background:var(--gold);color:#2b1d00;border-color:var(--gold)}
#laneBtn{position:fixed;right:18px;bottom:18px;z-index:6;padding:8px 12px;border-radius:10px;background:rgba(11,42,74,.6);color:#fff;font-weight:800;font-size:13px}
#laneBtn.off{opacity:.55}

/* 진행 점 */
#dots{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:5;display:flex;gap:7px;align-items:center;background:rgba(11,42,74,.55);padding:9px 14px;border-radius:999px}
#dots i{width:clamp(10px,.9vw,16px);height:clamp(10px,.9vw,16px);border-radius:50%;background:rgba(255,255,255,.25);transition:background .2s,transform .2s}
#dots i.ok{background:var(--sc,#4ade80)}
#dots i.pf{background:#fff7c2;box-shadow:0 0 8px #ffe15a}
#dots i.bad{background:#ff5d6e}
#dots i.cur{animation:dp .6s ease-in-out infinite alternate;background:rgba(255,255,255,.75)}
@keyframes dp{to{transform:scale(1.45)}}

/* 대기실 */
#lobby{position:fixed;left:2vw;top:11vh;bottom:4vh;width:min(28vw,460px);z-index:6;background:#fff;border-radius:24px;border:6px solid var(--gold);box-shadow:0 10px 0 var(--gold2);padding:2vh 1.5vw;display:flex;flex-direction:column;gap:1vh}
#lobby .t{font-weight:900;font-size:clamp(17px,1.5vw,28px);color:var(--navy);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#lobby .t small{font-size:.55em;color:var(--muted);font-weight:800}
#lobby .join{display:flex;gap:1vw;align-items:center}
#lobby .qr{width:clamp(100px,9.5vw,190px);height:clamp(100px,9.5vw,190px);border-radius:12px;border:1px solid var(--line);image-rendering:pixelated;flex:none}
#lobby .lbl{font-size:clamp(11px,.9vw,15px);color:var(--muted);font-weight:700}
#lobby .pin{font-weight:900;font-size:clamp(40px,4.4vw,88px);letter-spacing:4px;color:var(--navy);line-height:1}
#lobby .url{font-weight:800;font-size:clamp(11px,.85vw,15px);color:#123b66;word-break:break-all;margin-top:.5vh}
#lobby .meta{font-size:clamp(12px,1vw,17px);font-weight:800;display:flex;justify-content:space-between}
#plist{flex:1;min-height:40px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;border-top:1px solid var(--line);padding-top:1vh}
.pc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;font-weight:700;font-size:clamp(11px,.9vw,15px);background:#fff}
.pc:hover{border-color:var(--red);color:var(--red)}
.pc i{width:13px;height:13px;border-radius:50%}
.pc.off{opacity:.45}
.sets{display:flex;flex-direction:column;gap:.7vh;border-top:1px solid var(--line);padding-top:1vh}
.sets .f{display:flex;align-items:center;gap:8px}
.sets .f > span{font-size:clamp(11px,.85vw,14px);font-weight:800;color:var(--muted);width:4.6em;flex:none}
.seg{display:flex;gap:5px;flex:1}
.seg button{flex:1;padding:clamp(5px,.8vh,10px) 4px;border-radius:10px;background:#eef2f7;font-weight:800;color:var(--navy);font-size:clamp(12px,.9vw,15px)}
.seg button.on{background:var(--navy);color:#fff}
.how{font-size:clamp(11px,.82vw,14px);color:#38506d;line-height:1.5;background:#f5f8fc;border-radius:12px;padding:.8vh .8vw;font-weight:600}
.how b{color:var(--navy)}
#lobby .row{display:flex;gap:8px}
#lobby .start{flex:1;padding:1.6vh;border-radius:16px;background:var(--navy);color:#fff;font-weight:900;font-size:clamp(17px,1.5vw,26px)}
#lobby .small{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#lobby .small button{background:none;color:#123b66;font-weight:700;font-size:12px;padding:0;text-decoration:underline}
@media (max-width:900px){#lobby{width:min(46vw,420px)}}
@media (max-height:640px){#lobby{top:9vh;bottom:2vh;gap:.6vh}#lobby .how{display:none}#lobby .qr{width:84px;height:84px}#lobby .pin{font-size:40px}#lobby .start{padding:1vh}}

/* 배너 */
#big{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:8;font-weight:900;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25),0 0 40px rgba(0,0,0,.25);font-size:clamp(80px,12vw,220px);pointer-events:none;white-space:nowrap;letter-spacing:-2px}
#big.mid{font-size:clamp(60px,8vw,150px)}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
#big.final{animation:pop .5s cubic-bezier(.2,1.6,.4,1),fin .32s .5s ease-in-out infinite alternate}
@keyframes fin{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.1);text-shadow:0 6px 0 rgba(0,0,0,.25),0 0 60px rgba(255,60,60,.9)}}
#stg{position:fixed;left:50%;top:15vh;transform:translateX(-50%);z-index:7;pointer-events:none;text-align:center;color:#fff}
#stg .n{font-weight:900;font-size:clamp(30px,3.6vw,66px);letter-spacing:2px;text-shadow:0 4px 0 rgba(0,0,0,.3)}
#stg .s{display:inline-block;margin-top:.4vh;font-weight:900;font-size:clamp(16px,1.6vw,30px);background:rgba(11,42,74,.8);padding:.5vh 1.4vw;border-radius:999px}
#stg.show{animation:stgIn 2.4s ease forwards}
@keyframes stgIn{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
#conn{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:9;background:rgba(226,54,79,.92);color:#fff;font-weight:800;padding:8px 18px;border-radius:999px}

/* 결과 */
#end{position:fixed;inset:0;z-index:20;background:rgba(14,10,40,.8);display:grid;place-items:center;color:#fff;text-align:center;overflow:auto}
#end .box{padding:3vh 2vw;max-width:96vw}
#end h1{font-size:clamp(34px,4vw,70px);margin:0;color:var(--gold);font-weight:900;letter-spacing:-1px}
#end .sub{font-size:clamp(15px,1.4vw,24px);font-weight:800;color:#d9e3f5;margin:.6vh 0 2.4vh}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:1.4vw;margin-bottom:2.2vh}
.pod{width:clamp(130px,13vw,230px);display:flex;flex-direction:column;align-items:center}
.pod canvas{width:clamp(84px,8vw,150px);height:clamp(96px,9.2vw,172px)}
.pod .nm{font-weight:900;font-size:clamp(18px,1.7vw,32px);margin:.3vh 0 .2vh;word-break:keep-all}
.pod .st{font-size:clamp(11px,.9vw,15px);font-weight:700;color:#c9d7ea;margin-bottom:.8vh}
.pod .blk{width:100%;border-radius:16px 16px 0 0;background:#fff;color:var(--navy);font-weight:900;font-size:clamp(34px,3.2vw,60px);display:grid;place-items:center}
.pod.r1 .blk{background:var(--gold);height:15vh}.pod.r2 .blk{height:10vh}.pod.r3 .blk{height:7vh;background:#ffd9b0}
.rest{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:6px;max-width:min(1300px,92vw);margin:0 auto 2.2vh;max-height:22vh;overflow:auto;text-align:left}
.rest div{background:rgba(255,255,255,.1);border-radius:10px;padding:6px 12px;font-weight:700;font-size:clamp(12px,.95vw,16px);display:flex;gap:8px;align-items:center;white-space:nowrap}
.rest b{color:var(--gold);min-width:2em}
.rest i{width:11px;height:11px;border-radius:50%;flex:none}
.rest em{font-style:normal;color:#c9d7ea;font-weight:600;overflow:hidden;text-overflow:ellipsis}
#end .row{display:flex;gap:10px;justify-content:center}
#end .row .btn{font-size:18px;padding:13px 26px}
.pod .blk{line-height:1;overflow:hidden}
@media (max-height:700px){#end .box{padding:1.5vh 2vw}#end h1{font-size:30px}#end .sub{margin:.3vh 0 1.2vh;font-size:14px}.pod canvas{width:64px;height:74px}.pod .nm{font-size:16px}.pod .st{font-size:10px}.pod .blk{font-size:24px}.pod.r1 .blk{height:9vh}.pod.r2 .blk{height:6.5vh}.pod.r3 .blk{height:5vh}.podium{margin-bottom:1.2vh}.rest{max-height:20vh;margin-bottom:1.2vh}.rest div{padding:3px 10px}#end .row .btn{font-size:15px;padding:9px 20px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hudL">
  <div class="chip">방 <b id="hPin">----</b></div>
  <div class="chip stg" id="hStg">PART 3 · 단체 줄넘기</div>
  <div class="chip hidden" id="hAlive"></div>
  <div class="chip hidden" id="hOut"></div>
</div>
<div id="hudR">
  <button class="ibtn" id="muteBtn" title="소리">🔊</button>
  <button class="ibtn" id="fsBtn" title="전체 화면">⛶</button>
</div>
<div id="dots" class="hidden"></div>

<div id="ctrl" class="hidden">
  <button class="btn ghost" id="stopBtn">그만하고 결과 보기</button>
  <button class="btn ghost" id="resetBtn">대기실로</button>
</div>
<button id="laneBtn" title="박자선 보이기/숨기기">♪ 박자선</button>

<div id="big" class="hidden"></div>
<div id="stg" class="hidden"><div class="n" id="stgN"></div><div class="s" id="stgS"></div></div>
<div id="conn" class="hidden">서버와 다시 연결하는 중…</div>

<section id="lobby" class="hidden">
  <div class="t">휴대폰으로 들어오세요 <small>PART 3 단체 줄넘기</small></div>
  <div class="join"><img class="qr" id="qr" alt="QR">
    <div><div class="lbl">방 번호</div><div class="pin" id="lPin">----</div><div class="url" id="lUrl"></div></div></div>
  <div class="meta"><span id="lCnt">0명 입장</span><span style="color:var(--muted)" id="lSet"></span></div>
  <div id="plist"></div>
  <div class="sets">
    <div class="f"><span>걸리면</span><div class="seg" id="sMode"><button data-v="out">걸리면 탈락</button><button data-v="life">하트 3개</button></div></div>
    <div class="f"><span>시작 단계</span><div class="seg" id="sLv"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div></div>
  </div>
  <div class="how">① 줄이 <b>바닥을 칠 때</b> 폰 화면을 톡! 눌러 점프<br>② 너무 일찍 뛰면 내려오다 걸려요 — 줄이 <b>내려올 때</b> 맞춰서<br>③ 단계가 오를수록 빨라지고 박자가 바뀌어요 (6단계 FINAL)</div>
  <div class="small">테스트: <button id="bot10">봇 10명 추가</button><button id="botClr">봇 지우기</button></div>
  <div class="row"><button class="start" id="startBtn">시작 <span style="font-size:.6em;opacity:.6">Space</span></button></div>
</section>

<section id="end" class="hidden">
  <div class="box">
    <h1 id="endTitle">결과</h1>
    <div class="sub" id="endSub"></div>
    <div class="podium" id="podium"></div>
    <div class="rest" id="rest"></div>
    <div class="row"><button class="btn gold" id="againBtn">한 판 더</button><button class="btn" id="setBtn">설정 바꾸기</button></div>
  </div>
</section>
<canvas id="fxc"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/jr-common.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const jparse = (s) => { try { return JSON.parse(s); } catch (e) { return null; } };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const STAGE_NAMES = ['', '워밍업', '박자 맞추기', '따-따-다', '점점 빨라져요', '뜸 들이기', 'FINAL'];
const CFG_KEY = 'sumus-jr:cfg', HOST_KEY = 'sumus-jr:host';

/* ── 설정 ── */
const cfg = Object.assign({ mode: 'out', level: 1 }, jparse(lsGet(CFG_KEY)) || {});
function paintSegs() {
  const m = phase.mode || cfg.mode, l = phase.startLevel || cfg.level;
  $('#sMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === m));
  $('#sLv').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v === +l));
  $('#lSet').textContent = `${m === 'life' ? '하트 3개' : '걸리면 탈락'} · ${l}단계부터`;
}
function setCfg(k, v) {
  cfg[k] = v; lsSet(CFG_KEY, JSON.stringify({ mode: cfg.mode, level: cfg.level }));
  if (k === 'mode') phase.mode = v; else phase.startLevel = v;
  paintSegs(); socket.emit('jr:config', { mode: cfg.mode, level: cfg.level });
}
$('#sMode').onclick = (e) => { const v = e.target.dataset.v; if (v) setCfg('mode', v); };
$('#sLv').onclick = (e) => { const v = e.target.dataset.v; if (v) setCfg('level', +v); };

/* ── 소켓 ── */
const socket = io();
const clock = IQ.makeClock(socket);
let room = null;
let phase = { phase: 'none', mode: cfg.mode, startLevel: cfg.level, stage: 0, stages: 6 };
let roster = new Map();
let plan = null;

function joined(r) { room = r; setupJoin(r.pin); applyPhase(phase.phase); }
socket.on('connect', () => {
  $('#conn').classList.add('hidden');
  const saved = jparse(sessionStorage.getItem(HOST_KEY));
  const sess = jparse(sessionStorage.getItem('sumus-sess'));
  const recreate = () => {
    if (!sess) return location.replace('/');
    socket.emit('jr:create', { pin: sess.pin, sk: sess.key, mode: cfg.mode, level: cfg.level }, (n) => {
      if (!n || !n.ok) return alert((n && n.error) || '방을 다시 열지 못했습니다.');
      sessionStorage.setItem(HOST_KEY, JSON.stringify(n)); joined(n);
      if (n.pin !== sess.pin) alert(`서버가 다시 시작되어 새 방을 열었습니다.\n새 방 번호: ${n.pin}\n학생들은 다시 입장해야 합니다.`);
    });
  };
  if (!saved) return recreate();
  socket.emit('jr:resume', saved, (r) => { if (r && r.ok) joined(saved); else recreate(); });
});
socket.on('disconnect', () => $('#conn').classList.remove('hidden'));

async function setupJoin(pin) {
  let origin = location.origin;
  if (/^(localhost|127\.)/.test(location.hostname)) { try { const i = await (await fetch('/api/info')).json(); if (i.ips[0]) origin = `http://${i.ips[0]}:${location.port || 80}`; } catch (e) {} }
  const url = `${origin}/play?pin=${pin}`;
  $('#qr').src = `/api/qr?text=${encodeURIComponent(url)}`; $('#lUrl').textContent = url.replace(/^https?:\/\//, '');
  $('#lPin').textContent = pin; $('#hPin').textContent = pin;
}

let readyAt = 0, cdShown = null, goShown = false;
socket.on('jr:phase', (p) => {
  const prev = phase.phase; phase = p;
  if (p.phase === 'ready') { readyAt = p.serverT + p.readyRemain; if (prev !== 'ready') { cdShown = null; goShown = false; } }
  applyPhase(prev);
});
socket.on('jr:roster', (l) => { roster = new Map(l.map(p => [p.id, p])); syncEnts(); renderRoster(); updateHud(); });
socket.on('jr:plan', (p) => {
  const isNew = !plan || plan.stage !== p.stage || plan.start !== p.start;
  plan = p;
  if (isNew) {
    const now = clock.now();
    hitFxIdx = p.hits.findIndex(h => h > now); if (hitFxIdx < 0) hitFxIdx = p.hits.length;
    lastSw = { k: -9, theta: 0 };
    if (now < p.start + 1200) bannerQ = { at: Math.max(now, p.start - 1400), stage: p.stage, name: p.name, final: p.final };
    for (const k in results) if (k.startsWith(p.stage + ':')) delete results[k];
  }
  buildDots(); updateHud();
});
socket.on('jr:hit', onHitResult);
socket.on('jr:stage', (s) => {
  if (document.hidden) return;
  cheerT = clock.now(); giant.cheerT = cheerT;
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].type === 'txt') fx.splice(i, 1);
  showBig(s.final ? 'ALL CLEAR!' : 'CLEAR!', 1500, JR.stageColor(s.cleared), 'mid');
  sfx('fanfare');
});
socket.on('jr:j', (arr) => {
  const now = clock.now(); let n = 0;
  for (let i = 0; i < arr.length; i += 2) {
    const e = ents.get(arr[i]), ts = arr[i + 1];
    if (!e || ts < now - 1500 || e.jumps.includes(ts)) continue;
    e.jumps.push(ts); if (e.jumps.length > 3) e.jumps.shift(); n++;
  }
  if (n && !document.hidden) sfx('pop', n);
});

function applyPhase(prev) {
  const p = phase.phase, inGame = p === 'play' || p === 'ready';
  $('#lobby').classList.toggle('hidden', p !== 'lobby' || !room);
  $('#ctrl').classList.toggle('hidden', !inGame);
  $('#end').classList.toggle('hidden', p !== 'end');
  $('#dots').classList.toggle('hidden', !inGame || !plan);
  if (p === 'lobby') {
    if (prev !== 'lobby') { plan = null; bannerQ = null; $('#big').classList.add('hidden'); $('#stg').className = 'hidden'; for (const k in results) delete results[k]; streak = 0; fx.length = 0; for (const e of ents.values()) { e.fall = null; e.trip = 0; e.shieldUntil = 0; e.jumps.length = 0; } readyAt = 0; }
    syncEnts(true);
  }
  if (p === 'ready' && prev !== 'ready') { plan = null; syncEnts(true); for (const k in results) delete results[k]; streak = 0; }
  if (p === 'end' && prev !== 'end') showEnd(prev !== 'none');
  if (p !== 'end') confetti.length = 0;
  paintSegs(); updateHud(); measureLobby(); placeDots();
}

/* ── 명단·HUD ── */
function renderRoster() {
  const l = [...roster.values()].sort((a, b) => a.slot - b.slot);
  $('#lCnt').textContent = `${l.length}명 입장`;
  $('#plist').innerHTML = l.map(p => `<button class="pc ${p.connected ? '' : 'off'}" data-id="${esc(p.id)}" title="눌러서 내보내기"><i style="background:${esc(p.color)}"></i>${esc(p.name)}</button>`).join('');
}
function updateHud() {
  const p = phase.phase, inGame = p === 'play' || p === 'ready' || p === 'end';
  const l = [...roster.values()], alive = l.filter(x => x.state === 'in'), out = l.length - alive.length;
  const st = (plan && plan.stage) || phase.stage || phase.startLevel || 1;
  const el = $('#hStg');

      const fs = Math.max(26, Lg.s0 * 0.8) * sc, y = Math.max(Lg.axisY - Lg.R - Lg.s0 * 0.7, topSafe + Math.max(26, Lg.s0 * 0.8) * 0.8) - u * Lg.s0 * 0.5;
      ctx.save(); ctx.globalAlpha = u > 0.75 ? (1 - u) / 0.25 : 1; ctx.font = `900 ${fs}px Pretendard,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = fs * 0.16; ctx.strokeStyle = 'rgba(30,10,40,.75)'; ctx.lineJoin = 'round'; ctx.strokeText(f.text, Lg.ccx, y); ctx.fillStyle = f.color; ctx.fillText(f.text, Lg.ccx, y); ctx.restore();
    }
  }
}

/* ═════════ 박자선 ═════════ */
function drawLane(now) {
  if (!laneOn || !plan || !(phase.phase === 'play' || phase.phase === 'ready')) return;
  let w = Math.min(W * 0.4, 720), x0 = W / 2 - w / 2; if (x0 < laneL) x0 = laneL; if (x0 + w > laneR) w = laneR - x0; if (w < 120) return; const h = Math.max(20, H * 0.026), y = H - h - 16, nowX = x0 + w * 0.12, span = 4500, pxms = (w * 0.86) / span;
  ctx.fillStyle = 'rgba(11,42,74,.5)'; rr(x0, y, w, h, h / 2); ctx.fill();
  ctx.save(); rr(x0, y, w, h, h / 2); ctx.clip();
  const c = JR.stageColor(plan.stage);
  plan.hits.forEach((ht, i) => {
    const x = nowX + (ht - now) * pxms; if (x < x0 - 10 || x > x0 + w + 10) return;
    const r = results[plan.stage + ':' + i], past = ht <= now;

  ctx.fillStyle = '#ffe15a'; ctx.fillRect(nowX - 1.5, y - 4, 3, h + 8);
  ctx.font = `800 ${Math.max(10, h * 0.5)}px Pretendard,sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText('NOW', nowX - 6, y + h / 2 + 1);
}

/* ═════════ 메인 루프 ═════════ */
let lastPn = performance.now(), frameDt = 0.016;
function frame() { requestAnimationFrame(frame); render(); }
function render() {
  const pn = performance.now(); frameDt = Math.min(0.05, (pn - lastPn) / 1000); lastPn = pn;
  const now = clock.now(), t = (now % 1e7) / 1000;
  layout(frameDt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 화면 흔들림
  const sa = now - shakeT;
  if (sa >= 0 && sa < 260) { const k = shakeA * (1 - sa / 260); ctx.translate(Math.sin(sa * 0.11) * k * 0.6, Math.sin(sa * 0.09 + 1) * k); }
  IQ.drawWater(ctx, W, H, t);
  drawSky(t); drawSeaTint(t); drawDeck(t, now);
  // 줄 상태
  const sw = plan && clock.ready ? JR.swing(plan, now) : { theta: 0, idle: true, k: -1 };
  if (plan && clock.ready) {
    while (hitFxIdx < plan.hits.length && plan.hits[hitFxIdx] <= now) { if (now - plan.hits[hitFxIdx] < 250 && !document.hidden) onRopeHit(hitFxIdx, now); hitFxIdx++; }
    if (!sw.idle) {

      if (sw.k !== dotCur) { const old = dotCur; dotCur = sw.k; paintDot(old); paintDot(dotCur); }
    }
    lastSw = { k: sw.k, theta: sw.theta };
  }
  const air = plan ? plan.air : 0.56, rest = plan ? plan.rest : 0.18;
  const front = sw.idle || JR.ropeInFront(sw.theta);
  drawRopeShadow(sw, now);
  let ropePts = null;
  if (!front) ropePts = drawRope(sw, now);
  const tags = []; drawCrowd(now, t, air, rest, tags);
  if (front) ropePts = drawRope(sw, now);
  const mid = [ropePts[NSEG / 2 * 3], ropePts[NSEG / 2 * 3 + 1]];
  octo([ropePts[0], ropePts[1]], mid, now, t, sw);
  crabG([ropePts[NSEG * 3], ropePts[NSEG * 3 + 1]], mid, now, t, sw);
  drawFallers(now, t);
  drawTags(tags);
  drawFx(now, t);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawLane(now);
  // 카운트다운 (서버 시각 기준)
  if ((phase.phase === 'ready' || phase.phase === 'play') && readyAt && clock.ready) {
    const rem = readyAt - now, n = Math.ceil(rem / 1000);
    if (phase.phase === 'ready' && rem > 0 && n !== cdShown) { cdShown = n; if (n <= 3) { showBig(String(n), 900); sfx('tick'); } else if (n === 4 || n === 5) showBig('준비~', 1100, '#ffe15a', 'mid'); }
    if (rem <= 0 && !goShown) { goShown = true; if (rem > -1200) { showBig('점프!', 800, '#7dffb0'); sfx('go'); } }
  }
  if (bannerQ && now >= bannerQ.at && (phase.phase === 'play' || phase.phase === 'ready')) { const b = bannerQ; bannerQ = null; if (now - b.at < 1500 && !document.hidden) showStage(b.stage, b.name, b.final); updateHud(); }
  if (phase.phase === 'end') { drawPodium(t); }
  drawConfetti();
}

/* ═════════ 결과 ═════════ */
let podCvs = [];
function showEnd(fresh) {
  const r = phase.result || { ranking: [], why: 'stop', stage: phase.stage };
  const rk = r.ranking || [], alive = rk.filter(x => x.alive);
  let title = '결과 발표', sub = '';
  if (r.why === 'clear') { title = alive.length === rk.length ? '전원 줄넘기 완주! 🎉' : '마지막까지 살아남았어요'; sub = alive.length === rk.length ? `${rk.length}명 모두 FINAL 까지 넘었어요!` : `${alive.length}명이 6단계 FINAL 까지 완주!`; }
  else if (r.why === 'last') { title = rk[0] ? `👑 ${rk[0].name} 최후의 1인!` : '최후의 1인!'; sub = `STAGE ${r.stage} 까지 버텼어요`; }
  else if (r.why === 'out') { title = '모두 걸렸어요 ㅠㅠ'; sub = `STAGE ${r.stage} 까지 도전! 다음엔 더 멀리!`; }
  else { title = '여기까지! 결과 발표'; sub = `STAGE ${r.stage} 에서 멈췄어요 · 생존 ${alive.length}명`; }
  $('#endTitle').textContent = title; $('#endSub').textContent = sub;
  const stageLbl = (x) => x.alive ? (r.why === 'clear' ? '완주' : '생존') : `${x.outStage}단계 탈락`;
  const top = rk.slice(0, 3), order = [1, 0, 2].filter(i => top[i]);
  $('#podium').innerHTML = order.map(i => `<div class="pod r${i + 1}"><canvas width="170" height="195" data-i="${i}"></canvas><div class="nm">${esc(top[i].name)}</div><div class="st">${stageLbl(top[i])} · PERFECT ${top[i].perfect} · 콤보 ${top[i].best}</div><div class="blk">${i + 1}</div></div>`).join('');
  podCvs = [...document.querySelectorAll('#podium canvas')].map(c => ({ c, p: top[+c.dataset.i], i: +c.dataset.i }));
  $('#rest').innerHTML = rk.slice(3).map((x, i) => `<div><b>${i + 4}</b><i style="background:${esc(x.color)}"></i>${esc(x.name)}<em>· ${stageLbl(x)} · PERFECT ${x.perfect} · 최고 콤보 ${x.best}</em></div>`).join('');
  if (fresh) { burstConfetti(); sfx('win'); }
}
function drawPodium(t) {
  for (const { c, p, i } of podCvs) {
    const g = c.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
    const hop = i === 0 ? Math.abs(Math.sin(t * 4)) * 18 : Math.abs(Math.sin(t * 3 + i)) * 6;
    IQ.drawChar(g, c.width / 2, c.height - 14 - hop, 52, p.color, t, false, 1, null, { seed: p.id });
    if (i === 0) { g.fillStyle = '#f2c14e'; g.strokeStyle = '#a8740a'; g.lineWidth = 2; const cx = c.width / 2 + 2, cy = c.height - 14 - hop - 52 * 2.35;
      g.beginPath(); g.moveTo(cx - 26, cy + 12); g.lineTo(cx - 28, cy - 12); g.lineTo(cx - 13, cy); g.lineTo(cx, cy - 18); g.lineTo(cx + 13, cy); g.lineTo(cx + 28, cy - 12); g.lineTo(cx + 26, cy + 12); g.closePath(); g.fill(); g.stroke(); }
  }
}
const confetti = [];
const CCOL = ['#f2c14e', '#ef4565', '#3b6cf6', '#1fb36b', '#f5a524', '#c084fc', '#7dd3fc', '#ffffff'];
function burstConfetti() {
  for (let i = 0; i < 220; i++) confetti.push({ x: W * (0.2 + rnd() * 0.6), y: H * 0.35, vx: (rnd() - 0.5) * W * 0.9, vy: -H * (0.5 + rnd() * 0.9), r: 5 + rnd() * 7, a: rnd() * 6, va: (rnd() - 0.5) * 14, c: CCOL[i % CCOL.length], life: 0 });
  for (let i = 0; i < 120; i++) confetti.push({ x: rnd() * W, y: -rnd() * H * 0.6, vx: (rnd() - 0.5) * 60, vy: rnd() * 80, r: 5 + rnd() * 6, a: rnd() * 6, va: (rnd() - 0.5) * 10, c: CCOL[i % CCOL.length], life: 0 });
}
function drawConfetti() {
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.clearRect(0, 0, W, H);
  if (!confetti.length) return;
  const dt = frameDt;
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i]; p.life += dt; p.vy += H * 0.9 * dt; p.vx *= Math.pow(0.35, dt); p.vy = Math.min(p.vy, H * 0.28); p.x += p.vx * dt + Math.sin(p.life * 5 + p.a) * 30 * dt; p.y += p.vy * dt; p.a += p.va * dt;
    if (p.y > H + 20 || p.life > 9) { confetti.splice(i, 1); continue; }
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.a); fctx.scale(1, Math.cos(p.life * 8 + p.a)); fctx.fillStyle = p.c; fctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); fctx.restore();
  }
}

/* ═════════ 소리 (WebAudio 합성) ═════════ */
let AC = null, master = null, noiseBuf = null, muted = lsGet('sumus-island-mute') === '1';
const paintMute = () => { $('#muteBtn').textContent = muted ? '🔇' : '🔊'; };
paintMute();
$('#muteBtn').onclick = () => { muted = !muted; lsSet('sumus-island-mute', muted ? '1' : '0'); paintMute(); unlockAudio(); };
function unlockAudio() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
addEventListener('pointerdown', unlockAudio); addEventListener('keydown', unlockAudio);
const ok = () => AC && !muted && AC.state === 'running';
function tone(f, d, type = 'triangle', v = 0.18, when = 0, slide) {
  if (!ok()) return; const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g).connect(master); o.start(t0); o.stop(t0 + d + 0.02);
}
function noise(d, ftype, f0, f1, v, when = 0, q = 1, attack = 0.005) {
  if (!ok()) return; const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(), t0 = AC.currentTime + when;
  s.buffer = noiseBuf; s.loop = true; fl.type = ftype; fl.Q.value = q; fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(f1, t0 + d);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + attack); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  s.connect(fl).connect(g).connect(master); s.start(t0, Math.random() * 0.5); s.stop(t0 + d + 0.02);
}
let lastPop = 0;
function sfx(k, a, b) {
  try {
    if (!ok()) return;
    if (k === 'whoosh') { const d = clamp(a || 0.3, 0.08, 0.6), tp = b || 1; noise(d, 'bandpass', 380 * (0.8 + tp * 0.3), 1700 * (0.8 + tp * 0.3), 0.16, 0, 1.6, d * 0.85); }
    if (k === 'thwap') { const tp = a || 1; noise(0.11, 'lowpass', 2600, 500, 0.4, 0, 0.8, 0.002); tone(130 + tp * 20, 0.16, 'sine', 0.38, 0, 48); tone(1900, 0.03, 'square', 0.03); }
    if (k === 'pop') { const pnow = performance.now(); if (pnow - lastPop < 70) return; lastPop = pnow; const n = a || 1, f = 520 + Math.random() * 260; tone(f, 0.07, 'sine', Math.min(0.12, 0.035 + 0.025 * Math.log2(1 + n)), 0, f * 1.6); if (n > 4) noise(0.06, 'bandpass', 1500, 2500, 0.03, 0, 2); }
    if (k === 'chime') { tone(1318, 0.28, 'sine', 0.13); tone(1760, 0.34, 'sine', 0.11, 0.07); tone(2637, 0.2, 'sine', 0.04, 0.07); }
    if (k === 'ding') { tone(988, 0.18, 'sine', 0.1); tone(1318, 0.22, 'sine', 0.07, 0.06); }
    if (k === 'oops') { tone(330, 0.2, 'triangle', 0.13, 0, 220); tone(262, 0.28, 'triangle', 0.1, 0.12, 180); }
    if (k === 'oops2') { tone(300, 0.35, 'sawtooth', 0.07, 0, 120); }
    if (k === 'splash') { noise(0.55, 'lowpass', 3000, 250, 0.3, 0, 0.7, 0.01); tone(260, 0.14, 'sine', 0.15, 0.02, 900); tone(420, 0.1, 'sine', 0.08, 0.16, 1100); }
    if (k === 'tick') tone(880, 0.12, 'square', 0.07);
    if (k === 'go') { tone(660, 0.12, 'square', 0.08); tone(990, 0.3, 'square', 0.08, 0.1); }
    if (k === 'stage') [523, 659, 784].forEach((f, i) => tone(f, 0.18, 'triangle', 0.15, i * 0.09));
    if (k === 'final') { [392, 392, 392, 523].forEach((f, i) => tone(f, i === 3 ? 0.5 : 0.12, 'sawtooth', 0.07, i * 0.13)); noise(0.6, 'lowpass', 400, 100, 0.2, 0.39); }
    if (k === 'fanfare') { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, 'triangle', 0.15, i * 0.08)); [784, 1046, 1318].forEach(f => tone(f, 0.5, 'triangle', 0.08, 0.34)); }
    if (k === 'win') { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, 0.26, 'triangle', 0.15, i * 0.12)); [1046, 1318, 1568].forEach(f => tone(f, 0.9, 'sine', 0.07, 0.86)); }
  } catch (e) {}
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastPn = performance.now(); for (let i = fx.length - 1; i >= 0; i--) if (fx[i].type !== 'txt') fx.splice(i, 1); } });
resize(); applyPhase('none'); requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureLobby);
</script>
