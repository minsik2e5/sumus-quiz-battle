<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>try { if (!sessionStorage.getItem('sumus-sess')) location.replace('/'); } catch (e) { location.replace('/'); }</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMUS ISLAND PART 4 — 바나나킥</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0b2a4a;--gold:#f2c14e;--gold2:#d9a21b;--muted:#6b7c93;--line:#dde5ee;--red:#e2364f;--green:#1fb36b;--neon:#4fe3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#04101f;color:#13233a}
button{font:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
.invis{visibility:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.chip{background:rgba(6,22,46,.86);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:clamp(13px,1.2vw,21px);display:flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid rgba(79,227,255,.25)}
.chip b{color:var(--gold)}
#hudL{position:fixed;left:20px;top:18px;display:flex;gap:8px;z-index:5;flex-wrap:wrap;max-width:40vw}
#hudR{position:fixed;right:18px;top:18px;display:flex;gap:8px;z-index:5}
.ibtn{width:42px;height:42px;border-radius:12px;background:rgba(6,22,46,.75);color:#fff;font-size:17px;display:grid;place-items:center}
#hLv{flex-direction:column;align-items:stretch;gap:5px;padding:7px 16px 8px}
#hLv .g{height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
#hLv .g i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#4fe3ff,#ffe14d 55%,#ff4d6d)}
#ctrl{position:fixed;left:20px;bottom:18px;display:flex;gap:8px;z-index:6}
.btn{padding:11px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.ghost{background:rgba(255,255,255,.82)}
.btn.gold{background:var(--gold);color:#2b1d00;border-color:var(--gold)}

/* 타이머 */
#timer{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;background:rgba(6,22,46,.82);border:2px solid rgba(79,227,255,.45);border-radius:18px;padding:4px 18px 6px;color:#fff;box-shadow:0 0 24px rgba(79,227,255,.18);pointer-events:none}
#timer .l{font-size:clamp(11px,.85vw,15px);font-weight:800;color:#9fd8ff;line-height:1.1;text-align:center}
#timer .v{font-weight:900;font-size:clamp(28px,3.3vw,60px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px;min-width:2.6em;text-align:center}
#timer .a{font-weight:900;font-size:clamp(14px,1.3vw,24px);color:var(--gold);white-space:nowrap}
#timer.warn{border-color:#ff4d6d;box-shadow:0 0 30px rgba(255,77,109,.45)}
#timer.warn .v{color:#ff6b80;animation:tw .5s ease-in-out infinite alternate}
@keyframes tw{to{transform:scale(1.08)}}

/* 순위 */
#lb{position:fixed;right:18px;top:76px;z-index:5;width:clamp(170px,14.5vw,290px);background:rgba(6,22,46,.78);border:2px solid rgba(79,227,255,.3);border-radius:16px;padding:8px 10px 9px;color:#fff;pointer-events:none}
#lb .h{font-weight:900;font-size:clamp(12px,1vw,18px);color:#9fd8ff;margin:0 2px 5px;display:flex;justify-content:space-between}
#lb .h b{color:var(--gold)}
#lb .r{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:9px;font-weight:800;font-size:clamp(12px,1vw,18px)}
#lb .r:first-of-type{background:rgba(242,193,78,.16)}
#lb .r .k{width:1.3em;text-align:center;color:#9fd8ff;font-weight:900}
#lb .r i{width:11px;height:11px;border-radius:50%;flex:none}
#lb .r .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .r b{color:var(--gold);font-variant-numeric:tabular-nums}
#lb .r.out{opacity:.45}
#lb .e{font-size:12px;color:#9fb6d0;font-weight:700;padding:2px 4px}

/* 대기실 */
#lobby{position:fixed;left:2vw;top:11vh;bottom:4vh;width:min(28vw,460px);z-index:6;background:#fff;border-radius:24px;border:6px solid var(--gold);box-shadow:0 10px 0 var(--gold2);padding:2vh 1.5vw;display:flex;flex-direction:column;gap:1vh}
#lobby .t{font-weight:900;font-size:clamp(17px,1.5vw,28px);color:var(--navy);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#lobby .t small{font-size:.55em;color:var(--muted);font-weight:800}
#lobby .join{display:flex;gap:1vw;align-items:center}
#lobby .qr{width:clamp(100px,8.6vw,172px);height:clamp(100px,8.6vw,172px);border-radius:12px;border:1px solid var(--line);image-rendering:pixelated;flex:none}
#lobby .join > div{min-width:0}
#lobby .lbl{font-size:clamp(11px,.9vw,15px);color:var(--muted);font-weight:700}
#lobby .pin{font-weight:900;font-size:clamp(38px,3.7vw,74px);letter-spacing:3px;color:var(--navy);line-height:1}
#lobby .url{font-weight:800;font-size:clamp(11px,.85vw,15px);color:#123b66;word-break:break-all;margin-top:.5vh}
#lobby .meta{font-size:clamp(12px,1vw,17px);font-weight:800;display:flex;justify-content:space-between;gap:8px}
#plist{flex:1;min-height:40px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;border-top:1px solid var(--line);padding-top:1vh}
.pc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;font-weight:700;font-size:clamp(11px,.9vw,15px);background:#fff}
.pc:hover{border-color:var(--red);color:var(--red)}
.pc i{width:13px;height:13px;border-radius:50%}
.pc.off{opacity:.45}
.sets{display:flex;flex-direction:column;gap:.7vh;border-top:1px solid var(--line);padding-top:1vh}
.sets .f{display:flex;align-items:center;gap:8px}
.sets .f > span{font-size:clamp(11px,.85vw,14px);font-weight:800;color:var(--muted);width:4.2em;flex:none}
.seg{display:flex;gap:5px;flex:1}
.seg button{flex:1;padding:clamp(5px,.8vh,10px) 4px;border-radius:10px;background:#eef2f7;font-weight:800;color:var(--navy);font-size:clamp(12px,.9vw,15px)}
.seg button.on{background:var(--navy);color:#fff}
.how{font-size:clamp(11px,.82vw,14px);color:#38506d;line-height:1.5;background:#f5f8fc;border-radius:12px;padding:.8vh .8vw;font-weight:600}
.how b{color:var(--navy)}
#lobby .row{display:flex;gap:8px}
#lobby .start{flex:1;padding:1.6vh;border-radius:16px;background:var(--navy);color:#fff;font-weight:900;font-size:clamp(17px,1.5vw,26px)}
#lobby .small{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#lobby .small button{background:none;color:#123b66;font-weight:700;font-size:12px;padding:0;text-decoration:underline}
@media (max-width:900px){#lobby{width:min(46vw,420px)}}
@media (max-height:640px){#lobby{top:9vh;bottom:2vh;gap:.6vh}#lobby .how{display:none}#lobby .qr{width:84px;height:84px}#lobby .pin{font-size:40px}#lobby .start{padding:1vh}}

/* 배너 */
#big{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:8;font-weight:900;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.3),0 0 40px rgba(0,0,0,.35);font-size:clamp(80px,12vw,220px);pointer-events:none;white-space:nowrap;letter-spacing:-2px}
#big.mid{font-size:clamp(60px,8vw,150px)}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
#big.final{animation:pop .5s cubic-bezier(.2,1.6,.4,1),fin .32s .5s ease-in-out infinite alternate}
@keyframes fin{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.1);text-shadow:0 6px 0 rgba(0,0,0,.25),0 0 60px rgba(255,60,60,.9)}}
#lvl{position:fixed;left:50%;top:18vh;transform:translateX(-50%);z-index:7;pointer-events:none;text-align:center;color:#fff}
#lvl .n{font-weight:900;font-size:clamp(30px,3.6vw,66px);letter-spacing:2px;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(79,227,255,.5)}
#lvl .s{display:inline-block;margin-top:.4vh;font-weight:900;font-size:clamp(16px,1.6vw,30px);background:rgba(6,22,46,.85);padding:.5vh 1.4vw;border-radius:999px;border:2px solid currentColor}
#lvl.show{animation:lvIn 2.4s ease forwards}
@keyframes lvIn{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
#conn{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:9;background:rgba(226,54,79,.92);color:#fff;font-weight:800;padding:8px 18px;border-radius:999px}

/* 결과 */
#end{position:fixed;inset:0;z-index:20;background:rgba(3,10,28,.82);display:grid;place-items:center;color:#fff;text-align:center;overflow:auto}
#end .box{padding:3vh 2vw;max-width:96vw}
#end h1{font-size:clamp(34px,4vw,70px);margin:0;color:var(--gold);font-weight:900;letter-spacing:-1px}
#end .sub{font-size:clamp(15px,1.4vw,24px);font-weight:800;color:#d9e3f5;margin:.6vh 0 2.4vh}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:1.4vw;margin-bottom:2.2vh}
.pod{width:clamp(130px,13vw,230px);display:flex;flex-direction:column;align-items:center}
.pod canvas{width:clamp(84px,8vw,150px);height:clamp(96px,9.2vw,172px)}
.pod .nm{font-weight:900;font-size:clamp(18px,1.7vw,32px);margin:.3vh 0 .2vh;word-break:keep-all}
.pod .st{font-size:clamp(11px,.9vw,15px);font-weight:700;color:#c9d7ea;margin-bottom:.8vh}
.pod .blk{width:100%;border-radius:16px 16px 0 0;background:#fff;color:var(--navy);font-weight:900;font-size:clamp(34px,3.2vw,60px);display:grid;place-items:center;line-height:1;overflow:hidden}
.pod.r1 .blk{background:var(--gold);height:15vh}.pod.r2 .blk{height:10vh}.pod.r3 .blk{height:7vh;background:#ffd9b0}
.rest{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(390px,90vw),1fr));gap:6px;max-width:min(1300px,92vw);margin:0 auto 2.2vh;max-height:22vh;overflow:auto;text-align:left}
.rest div{background:rgba(255,255,255,.1);border-radius:10px;padding:6px 12px;font-weight:700;font-size:clamp(12px,.95vw,16px);display:flex;gap:8px;align-items:center;white-space:nowrap}
.rest b{color:var(--gold);min-width:2em}
.rest i{width:11px;height:11px;border-radius:50%;flex:none}
.rest em{font-style:normal;color:#c9d7ea;font-weight:600;overflow:hidden;text-overflow:ellipsis}
#end .row{display:flex;gap:10px;justify-content:center}
#end .row .btn{font-size:18px;padding:13px 26px}
@media (max-height:700px){#end .box{padding:1.5vh 2vw}#end h1{font-size:30px}#end .sub{margin:.3vh 0 1.2vh;font-size:14px}.pod canvas{width:64px;height:74px}.pod .nm{font-size:16px}.pod .st{font-size:10px}.pod .blk{font-size:24px}.pod.r1 .blk{height:9vh}.pod.r2 .blk{height:6.5vh}.pod.r3 .blk{height:5vh}.podium{margin-bottom:1.2vh}.rest{max-height:20vh;margin-bottom:1.2vh}.rest div{padding:3px 10px}#end .row .btn{font-size:15px;padding:9px 20px}}
@media (max-width:760px){#lb{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hudL">
  <div class="chip">방 <b id="hPin">----</b></div>
  <div class="chip" id="hLv"><span id="hLvT">PART 4 · 바나나킥</span><div class="g"><i id="hGauge"></i></div></div>
</div>
<div id="hudR">
  <button class="ibtn" id="muteBtn" title="소리">🔊</button>
  <button class="ibtn" id="fsBtn" title="전체 화면">⛶</button>
</div>
<div id="timer" class="invis"><div class="l" id="tmL">남은<br>시간</div><div class="v" id="tmV">0:00</div><div class="a hidden" id="tmA"></div></div>
<div id="lb" class="hidden"></div>

<div id="ctrl" class="hidden">
  <button class="btn ghost" id="stopBtn">그만하고 결과 보기</button>
  <button class="btn ghost" id="resetBtn">대기실로</button>
</div>

<div id="big" class="hidden"></div>
<div id="lvl" class="hidden"><div class="n" id="lvlN"></div><div class="s" id="lvlS"></div></div>
<div id="conn" class="hidden">서버와 다시 연결하는 중…</div>

<section id="lobby" class="hidden">
  <div class="t">휴대폰으로 들어오세요 <small>PART 4 바나나킥</small></div>
  <div class="join"><img class="qr" id="qr" alt="QR">
    <div><div class="lbl">방 번호</div><div class="pin" id="lPin">----</div><div class="url" id="lUrl"></div></div></div>
  <div class="meta"><span id="lCnt">0명 입장</span><span style="color:var(--muted)" id="lSet"></span></div>
  <div id="plist"></div>
  <div class="sets">
    <div class="f"><span>방식</span><div class="seg" id="sMode"><button data-v="out">탈락 (한 골 먹으면 끝)</button><button data-v="score">점수전</button></div></div>
    <div class="f" id="fTime"><span>시간</span><div class="seg" id="sTime"><button data-v="60">1분</button><button data-v="120">2분</button><button data-v="180">3분</button></div></div>
  </div>
  <div class="how">① 폰의 <b>◀ ▶ 버튼</b>으로 내 골키퍼를 좌우로 움직여요<br>② 공이 <b>바나나처럼 휘어요</b> — 도착할 곳을 미리 읽고 막기!<br>③ 정중앙으로 막으면 <b>WOW +50</b> · 연속 선방은 콤보 보너스</div>
  <div class="small">테스트: <button id="bot10">봇 10명 추가</button><button id="botClr">봇 지우기</button></div>
  <div class="row"><button class="start" id="startBtn">킥오프! <span style="font-size:.6em;opacity:.6">Space</span></button></div>
</section>

<section id="end" class="hidden">
  <div class="box">
    <h1 id="endTitle">결과</h1>
    <div class="sub" id="endSub"></div>
    <div class="podium" id="podium"></div>
    <div class="rest" id="rest"></div>
    <div class="row"><button class="btn gold" id="againBtn">한 판 더</button><button class="btn" id="setBtn">설정 바꾸기</button></div>
  </div>
</section>
<canvas id="fxc"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/bk-common.js"></script>
<script src="/bk-host-art.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const jparse = (s) => { try { return JSON.parse(s); } catch (e) { return null; } };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const A = BKART, sstep = A.sstep, rnd = Math.random;
const CFG_KEY = 'sumus-bk:cfg', HOST_KEY = 'sumus-bk:host';
const SH_NAME = { octo: '문어', crab: '꽃게', turtle: '거북이', puffer: '복어' };
const SH_COL = { octo: '#ff8a7a', crab: '#ff9a5c', turtle: '#8fe07a', puffer: '#ffd84a' };
const LV_COL = ['#7dffb0', '#4fe3ff', '#ffe14d', '#ff9a4d', '#ff4d6d'];
const VIEW_DELAY = 110;      // 골키퍼 보간(IQ.stepInterp)과 같은 만큼 공도 과거를 그려서 둘이 정확히 맞게
const EXIT_MS = 1900;        // 탈락한 골키퍼가 퇴장하는 연출 시간

/* ── 설정 ── */
const cfg = Object.assign({ mode: 'out', time: 120 }, jparse(lsGet(CFG_KEY)) || {});
if (![60, 120, 180].includes(+cfg.time)) cfg.time = 120;
function paintSegs() {
  const m = phase.mode || cfg.mode, tm = +(phase.time || cfg.time);
  $('#sMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === m));
  $('#sTime').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v === tm));
  $('#fTime').classList.toggle('hidden', m !== 'score');
  $('#lSet').textContent = m === 'score' ? `점수전 · ${tm / 60}분` : '탈락전 · 최후의 골키퍼';
}
function setCfg(k, v) {
  cfg[k] = v; lsSet(CFG_KEY, JSON.stringify({ mode: cfg.mode, time: cfg.time }));
  phase[k] = v; paintSegs(); socket.emit('bk:config', { mode: cfg.mode, time: cfg.time });
}
$('#sMode').onclick = (e) => { const v = e.target.closest('button'); if (v) setCfg('mode', v.dataset.v); };
$('#sTime').onclick = (e) => { const v = e.target.closest('button'); if (v) setCfg('time', +v.dataset.v); };

/* ── 소켓 ── */
const socket = io();
const clock = IQ.makeClock(socket);
let room = null;
let phase = { phase: 'none', mode: cfg.mode, time: cfg.time, level: 0, levels: BK.LEVELS.map(l => l.name) };
let roster = new Map();
const snap = new Map();      // bk:s 스냅샷 (IQ.applyState)
const ents = new Map();      // 화면의 골키퍼
const shots = new Map();     // 슛 id → shot
let volleys = [];            // 슛 묶음(슈터 한 명)
let level = 0, readyAt = 0, cdShown = null, goShown = false, endWhistle = false, lastTick = -1;
let vOff = null;             // 서버시각 − performance.now (bk:s 기준, IQ 보간과 같은 방식)

function joined(r) { room = r; setupJoin(r.pin); applyPhase(phase.phase); }
socket.on('connect', () => {
  $('#conn').classList.add('hidden');
  const saved = jparse(sessionStorage.getItem(HOST_KEY));
  const sess = jparse(sessionStorage.getItem('sumus-sess'));
  const recreate = () => {
    if (!sess) return location.replace('/');
    socket.emit('bk:create', { pin: sess.pin, sk: sess.key, mode: cfg.mode, time: cfg.time }, (n) => {
      if (!n || !n.ok) return alert((n && n.error) || '방을 다시 열지 못했습니다.');
      sessionStorage.setItem(HOST_KEY, JSON.stringify(n)); joined(n);
      if (n.pin !== sess.pin) alert(`서버가 다시 시작되어 새 방을 열었습니다.\n새 방 번호: ${n.pin}\n학생들은 다시 입장해야 합니다.`);
    });
  };
  if (!saved) return recreate();
  socket.emit('bk:resume', saved, (r) => { if (r && r.ok) joined(saved); else recreate(); });
});
socket.on('disconnect', () => $('#conn').classList.remove('hidden'));

async function setupJoin(pin) {
  let origin = location.origin;
  if (/^(localhost|127\.)/.test(location.hostname)) { try { const i = await (await fetch('/api/info')).json(); if (i.ips[0]) origin = `http://${i.ips[0]}:${location.port || 80}`; } catch (e) {} }
  const url = `${origin}/play?pin=${pin}`;
  $('#qr').src = `/api/qr?text=${encodeURIComponent(url)}`; $('#lUrl').textContent = url.replace(/^https?:\/\//, '');
  $('#lPin').textContent = pin; $('#hPin').textContent = pin;
}

socket.on('bk:phase', (p) => {
  const prev = phase.phase; phase = p;
  if (!phase.levels) phase.levels = BK.LEVELS.map(l => l.name);
  if (p.phase === 'ready') { readyAt = p.serverT + p.readyRemain; if (prev !== 'ready') { cdShown = null; goShown = false; } }
  if (p.phase === 'play' && !readyAt) readyAt = p.playAt;
  if (p.phase === 'play' || p.phase === 'end') level = Math.max(p.phase === prev ? level : 0, p.level || 0); else level = 0;
  applyPhase(prev);
});
