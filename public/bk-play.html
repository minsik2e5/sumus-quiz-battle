<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<title>바나나킥 — SUMUS ISLAND</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0b2a4a;--gold:#f2c14e;--gold2:#d9a21b;--muted:#6b7c93;--line:#dde5ee;--red:#e2364f;--green:#1fb36b;--yellow:#f5a524;--blue:#3d9bff;--neon:#3fd0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;height:100dvh;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#061820;color:#13233a;overscroll-behavior:none;overflow:hidden;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;border:0;cursor:pointer}
.hidden{display:none!important}

/* ── 입장 화면 (PART 2·3 과 같은 모양) ── */
#join{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0%,#1d6f8f 0%,rgba(29,111,143,0) 55%),linear-gradient(#082a3a,#0c4a4f 60%,#13675a)}
.jbox{width:100%;max-width:380px;background:#fff;border-radius:24px;border:5px solid var(--gold);box-shadow:0 8px 0 var(--gold2);padding:22px 20px}
.jbox h1{margin:0;font-size:13px;font-weight:800;color:var(--muted)}
.jbox h2{margin:2px 0 14px;font-size:22px;font-weight:900;color:var(--navy)}
.jbox label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 6px}
.jbox input{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:20px;font-weight:800;outline:none;font-family:inherit}
.jbox input:focus{border-color:var(--gold)}
#pinIn{letter-spacing:6px;text-align:center;font-size:28px}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--navy);box-shadow:0 0 0 3px #fff inset}
.jgo{margin-top:18px;width:100%;padding:16px;border-radius:16px;background:var(--navy);color:#fff;font-weight:900;font-size:19px}
.jgo:disabled{opacity:.6}
.jerr{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.conn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--yellow)}.conn.ok i{background:var(--green)}.conn.bad i{background:var(--red)}

/* ── 게임 화면 ── */
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#061820;color:#fff;touch-action:none;padding-top:env(safe-area-inset-top)}
.top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--navy);border-bottom:3px solid var(--gold);z-index:3}
.me{display:flex;align-items:center;gap:7px;min-width:0;background:rgba(255,255,255,.1);border-radius:999px;padding:5px 12px 5px 5px;font-weight:900;font-size:15px}
.me i{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid #fff}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me b{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.me b.ok{background:var(--green)}.me b.bad{background:var(--red)}
#lvChip{margin-left:auto;flex:0 1 auto;min-width:0;font-weight:900;font-size:12.5px;padding:5px 10px;border-radius:999px;background:rgba(63,208,255,.14);border:2px solid rgba(63,208,255,.55);color:#bff0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvChip:empty{display:none}
#muteBtn{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:17px;display:grid;place-items:center}
#lvChip:empty+#muteBtn{margin-left:auto}

#scene{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:8px;right:8px;top:8px;display:flex;align-items:flex-start;gap:6px;pointer-events:none}
.chip{background:rgba(6,30,52,.78);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-weight:900;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%;font-variant-numeric:tabular-nums}
.chip em{font-style:normal;opacity:.8}
.chip.warn{border-color:#ff6b7f;color:#ffd0d6}
#scoreBox{margin-left:auto;text-align:right;background:rgba(6,30,52,.78);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:4px 10px;font-weight:900;line-height:1.15}
#score{font-size:18px;color:var(--gold);display:block;font-variant-numeric:tabular-nums}
#combo{font-size:12px;font-style:normal;opacity:.95;display:block;min-height:14px}
#combo.pulse{animation:cpulse .35s ease-out}
@keyframes cpulse{0%{transform:scale(1.5);color:#ffe15a}100%{transform:none}}

.layer{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
#banner{top:60%;opacity:0}
#banner div{display:inline-block;background:rgba(6,30,52,.84);border:3px solid var(--neon);border-radius:18px;padding:8px 18px;font-weight:900;font-size:min(7vw,28px);box-shadow:0 0 22px rgba(63,208,255,.55),0 6px 0 rgba(0,0,0,.25);color:#fff}
#banner small{display:block;font-size:.5em;opacity:.85;font-weight:800;margin-top:2px;color:#bff0ff}
#banner.show{animation:bannerA 2.2s ease-out forwards}
@keyframes bannerA{0%{opacity:0;transform:translateY(-14px) scale(.85)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#count{top:46%;font-weight:900;font-size:min(30vw,140px);line-height:1;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.3),0 0 30px rgba(63,208,255,.7)}
#count.tick{animation:countA .9s ease-out}
#count.go{color:#ffe15a;font-size:min(18vw,84px);text-shadow:0 6px 0 rgba(0,0,0,.3),0 0 30px rgba(255,210,80,.8)}
@keyframes countA{0%{transform:scale(1.6);opacity:0}15%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.85}}
#fx{top:40%;font-weight:900;font-size:min(15vw,68px);line-height:1;opacity:0;-webkit-text-stroke:2px rgba(0,0,0,.25);font-style:italic}
#fx.pop{animation:fxA .95s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes fxA{0%{opacity:0;transform:scale(.4) rotate(-6deg)}18%{opacity:1;transform:scale(1.12) rotate(2deg)}32%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-18px) scale(.96)}}
#fx.wow{color:#ffd84d;font-size:min(20vw,92px);text-shadow:0 5px 0 #b9770a,0 0 26px rgba(255,216,77,.9)}
#fx.ok{color:#5cf09a;text-shadow:0 4px 0 #0d7a40,0 0 18px rgba(92,240,154,.6)}
#fx.goal{color:#ff5d73;text-shadow:0 4px 0 #8c1426}
#fx.small{font-size:min(9vw,40px);color:#bff0ff;text-shadow:0 3px 0 #1d5d9b}
#fxSub{top:calc(40% + min(15vw,68px) + 4px);font-weight:900;font-size:min(5.6vw,24px);opacity:0;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#fxSub.pop{animation:subA 1.1s ease-out forwards}
@keyframes subA{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#comboFx{top:27%;font-weight:900;font-size:min(9vw,40px);opacity:0}
#comboFx.pop{animation:comboA 1.2s ease-out forwards}
#comboFx.c1{color:#ffb84d;text-shadow:0 3px 0 #7a3c00}
#comboFx.c2{color:#ff7ad1;text-shadow:0 3px 0 #6a0f4c,0 0 18px #ff7ad1;font-size:min(11vw,50px)}
#comboFx.c3{background:linear-gradient(90deg,#ff5d73,#ffd84d,#5cf09a,#5ab8ff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:min(12.5vw,56px);filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
@keyframes comboA{0%{opacity:0;transform:scale(.3) rotate(8deg)}20%{opacity:1;transform:scale(1.15)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,70,.15),rgba(255,30,60,.6))}
#flash.on{animation:flashA .6s ease-out}
#flash.gold{background:radial-gradient(ellipse at center,rgba(255,230,120,.4),rgba(255,200,60,0) 70%)}
#flash.green{background:radial-gradient(ellipse at center,rgba(120,255,180,.22),rgba(60,220,140,0) 70%)}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}
#specTag{bottom:10px}
#specTag span{display:inline-block;background:rgba(6,30,52,.86);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;font-weight:900;font-size:15px}
#syncTag{bottom:10px}
#syncTag span{display:inline-block;background:rgba(245,165,36,.92);color:#2b1a00;border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px}
#lobbyCard{top:42%;padding:0 12px}
#lobbyCard .card{display:inline-block;max-width:400px;background:rgba(6,30,52,.86);border:3px solid var(--gold);border-radius:20px;padding:10px 16px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#lobbyCard h3{margin:0 0 6px;font-size:min(6.2vw,25px);font-weight:900;text-align:center;color:#ffe15a}
#lobbyCard ol{margin:0;padding-left:20px;font-weight:800;font-size:min(3.8vw,15px);line-height:1.5}
#lobbyCard p{margin:6px 0 0;text-align:center;font-weight:800;font-size:12.5px;opacity:.85}
#lobbyCard{transition:top .4s}
@media (max-height:700px){#lobbyCard{top:50%}#lobbyCard ol{font-size:13px;line-height:1.4}}
#lobbyCard.mini{top:auto;bottom:10px}
#lobbyCard.mini .card{padding:6px 14px;border-width:2px;border-radius:999px;background:rgba(6,30,52,.72)}
#lobbyCard.mini h3{margin:0;font-size:15px}
#lobbyCard.mini ol,#lobbyCard.mini p{display:none}
#netBanner{top:50%;transform:translateY(-50%)}
#netBanner span{display:inline-block;background:rgba(196,42,67,.92);border-radius:14px;padding:10px 16px;font-weight:900;font-size:16px}
#outOv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(120,10,30,.35),rgba(30,5,15,.72))}
#outOv.show{animation:outA 2.6s ease-out forwards}
#outOv b{display:block;font-size:min(18vw,84px);font-weight:900;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.3)}
#outOv span{font-weight:800;font-size:17px}
@keyframes outA{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}

/* ── 좌우 버튼 ── */
#pad{flex:0 0 31%;display:flex;gap:12px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#0a2b33,#061a20);border-top:3px solid rgba(63,208,255,.45);position:relative;touch-action:none}
#pad::before{content:'';position:absolute;left:50%;top:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:2px;background:rgba(255,255,255,.08);pointer-events:none}
.pbtn{position:relative;flex:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#062030;background:linear-gradient(#7fe8ff,#2bb7e6 68%,#1895c4);box-shadow:0 10px 0 #0c5f80,0 12px 18px rgba(0,0,0,.4);transition:transform .05s,box-shadow .05s,filter .15s;touch-action:none;margin-bottom:10px;pointer-events:none}
.pbtn .ar{font-size:min(19vw,92px);line-height:.9;font-weight:900;text-shadow:0 3px 0 rgba(255,255,255,.5)}
.pbtn small{font-size:min(4vw,16px);font-weight:900;opacity:.75}
.pbtn.on{transform:translateY(8px);box-shadow:0 2px 0 #0c5f80,0 0 26px rgba(127,232,255,.85);filter:brightness(1.12)}
#pad.spec .pbtn{background:linear-gradient(#5d6b85,#3e4a62);color:#dfe8f5;box-shadow:0 10px 0 #262f40}
#pad.spec .pbtn .ar{opacity:.35;text-shadow:none}
#pad.wait .pbtn{filter:saturate(.6)}
#padMsg{position:absolute;left:0;right:0;top:50%;transform:translateY(-60%);text-align:center;pointer-events:none;font-weight:900;font-size:min(5.6vw,22px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#padMsg:empty{display:none}

/* ── 끝 화면 ── */
#endv{position:fixed;inset:0;z-index:8;overflow:auto;display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));background:rgba(4,16,26,.8);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ebox{width:100%;max-width:400px;background:#fff;border-radius:24px;border:5px solid var(--gold);box-shadow:0 8px 0 var(--gold2);padding:18px 16px;text-align:center;color:var(--navy);animation:eIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes eIn{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.ebox .k{font-size:13px;font-weight:800;color:var(--muted)}
.ebox .rank{font-size:min(16vw,68px);font-weight:900;line-height:1.05;margin:4px 0}
.ebox .rank small{font-size:.32em;color:var(--muted);font-weight:800}
.ebox .st{display:inline-block;border-radius:999px;padding:6px 14px;font-weight:900;font-size:15px;color:#fff}
.ebox .msg{font-weight:900;font-size:19px;margin:10px 0 2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.grid div{background:#f3f6fa;border-radius:14px;padding:8px 4px}
.grid b{display:block;font-size:20px;font-weight:900}
.grid span{font-size:12px;font-weight:800;color:var(--muted)}
.top3{margin-top:10px;text-align:left;font-weight:800;font-size:14px}
.top3 div{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px}
.top3 div.mine{background:#fff4cf}
.top3 i{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
.top3 em{margin-left:auto;font-style:normal;color:var(--muted);white-space:nowrap}
.ebox .note{margin-top:12px;font-size:13.5px;font-weight:800;color:var(--muted)}
</style>
</head>
<body>
<section id="join">
  <div class="jbox">
    <h1>SUMUS ISLAND · PART 4</h1>
    <h2>바나나킥 ⚽ 골키퍼</h2>
    <label for="pinIn">방 번호</label>
    <input id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    <label for="nameIn">이름</label>
    <input id="nameIn" maxlength="8" autocomplete="off" placeholder="최대 8글자">
    <label>캐릭터 색</label>
    <div class="sw" id="sw"></div>
    <button class="jgo" id="joinBtn">입장하기</button>
    <div class="jerr" id="jerr"></div>
    <div class="conn" id="conn"><i></i><span>서버 연결 중…</span></div>
  </div>
</section>

<section id="game" class="hidden">
  <header class="top">
    <div class="me"><i id="meDot"></i><span id="meName"></span><b id="netDot" class="ok"></b></div>
    <div id="lvChip"></div>
    <button id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>
  </header>
  <div id="scene">
    <canvas id="cv"></canvas>
    <div class="hud"><div class="chip" id="modeChip">대기실</div><div id="scoreBox"><b id="score">0</b><em id="combo"></em></div></div>
    <div class="layer" id="lobbyCard"><div class="card">
      <h3>곧 시작해요!</h3>
      <ol><li>나는 <b style="color:#ffe15a">골키퍼</b>! 섬 친구들이 슛을 차요</li><li>아래 <b style="color:#7fe8ff">◀ ▶ 버튼</b>으로 좌우로 움직여요</li><li>공이 골대에 닿을 때 공 아래에 있으면 선방!</li></ol>
      <p id="modeLine">지금 버튼으로 연습해 보세요</p>
    </div></div>
    <div class="layer" id="banner"><div></div></div>
    <div class="layer" id="count"></div>
    <div class="layer" id="fx"></div>
    <div class="layer" id="fxSub"></div>
    <div class="layer" id="comboFx"></div>
    <div id="flash"></div>
    <div id="outOv"><div><b>탈락!</b><span id="outSub">골을 먹었어요… 그래도 잘했어요!</span></div></div>
    <div class="layer hidden" id="specTag"><span>👀 관전 중 · 친구들을 응원해요</span></div>
    <div class="layer hidden" id="syncTag"><span>연결 중…</span></div>
    <div class="layer hidden" id="netBanner"><span>연결 끊김 — 다시 연결 중…</span></div>
  </div>
  <div id="pad">
    <div class="pbtn" id="btnL"><span class="ar">◀</span><small>왼쪽</small></div>
    <div class="pbtn" id="btnR"><span class="ar">▶</span><small>오른쪽</small></div>
    <div id="padMsg"></div>
  </div>
</section>
<section id="endv" class="hidden"></section>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/bk-common.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const COLORS = ['#ff4d6d', '#3d7bff', '#22c55e', '#ffb020', '#a855f7', '#14b8a6', '#f97316', '#ec4899', '#64748b', '#0ea5e9'];
const LS = 'sumus-island-player'; // 모든 게임이 같이 쓰는 저장소 → 수업 방에서 넘어와도 같은 학생
const LS_MUTE = 'sumus-island-mute';
let saved = {}; try { saved = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { saved = {}; }
const qs = new URLSearchParams(location.search);
const urlPin = qs.get('pin');
$('#pinIn').value = urlPin || '';
$('#nameIn').value = saved.name || '';
let color = COLORS.includes(saved.color) ? saved.color : COLORS[Math.floor(Math.random() * COLORS.length)];
$('#sw').innerHTML = COLORS.map(c => `<button style="background:${c}" data-c="${c}" class="${c === color ? 'on' : ''}" aria-label="색 선택"></button>`).join('');
$('#sw').onclick = (e) => { const c = e.target.dataset.c; if (!c) return; color = c; document.querySelectorAll('#sw button').forEach(b => b.classList.toggle('on', b.dataset.c === c)); };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const socket = io();
const clock = IQ.makeClock(socket);
let logN = 0;
const report = (msg) => { try { if (++logN > 15) return; socket.emit('clientlog', { msg: 'bk ' + String(msg).slice(0, 280), ua: navigator.userAgent.slice(0, 160), pin: $('#pinIn').value }); } catch (e) {} };
addEventListener('error', (e) => report('error: ' + e.message + ' @' + (e.lineno || '')));
addEventListener('unhandledrejection', (e) => report('rejection: ' + (e.reason && e.reason.message || e.reason)));
// 모든 이벤트 처리기를 감싸서 하나가 실패해도 화면이 멈추지 않게
const on = (ev, fn) => socket.on(ev, (...a) => { try { fn(...a); } catch (e) { report(ev + ': ' + (e && e.stack || e)); } });

const setConn = (c, t) => { $('#conn').className = 'conn ' + c; $('#conn span').textContent = t; $('#netDot').className = c; $('#netBanner').classList.toggle('hidden', c !== 'bad' || !joined); };
const tStart = Date.now();
socket.on('connect', () => setConn('ok', '서버 연결됨'));
socket.on('connect_error', () => setConn('bad', Date.now() - tStart < 70000 ? '서버 깨우는 중… (처음엔 최대 1분)' : '서버에 연결할 수 없습니다'));
socket.on('disconnect', () => { setConn('bad', '연결 끊김 — 다시 연결 중…'); releaseAll(); });

/* ── 상태 ── */
let me = null, joined = false, retries = 0;
let phase = { phase: 'none', mode: 'out' };
let roster = new Map();
const shots = new Map();                  // id → shot (+ 화면용 필드)
const g = new BK.Goalie();                // 내 골키퍼 (서버와 같은 계산)
let needReset = true, lastResetAt = null, joinSrvT = 0, wasReady = false;
let dirNow = 0;                           // 지금 버튼 방향 (-1/0/1)
const ptrs = new Map();                   // pointerId → -1|1 (누르고 있는 쪽)

    ctx.strokeStyle = IQ.shade(col, -0.15); ctx.lineWidth = q * 0.15; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(k * q * 0.6, sy + q * 0.02, gx, gy); ctx.stroke();
    // 장갑 (큼직하게)
    const gr = q * (0.19 + re * 0.03);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = OL; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.ellipse(gx, gy, gr * 0.95, gr, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffe15a'; ctx.beginPath(); ctx.ellipse(gx, gy + gr * 0.35, gr * 0.8, gr * 0.42, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = IQ.shade(col, 0.1); ctx.fillRect(gx - gr * 0.7, gy + gr * 0.55, gr * 1.4, gr * 0.3); // 손목 밴드
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = Math.max(1, q * 0.03);
    for (const f of [-0.35, 0, 0.35]) { ctx.beginPath(); ctx.moveTo(gx + f * gr, gy - gr * 0.85); ctx.lineTo(gx + f * gr, gy - gr * 0.25); ctx.stroke(); }
  };
  // 몸통 (내 색 유니폼)
  const bg2 = ctx.createLinearGradient(-q * 0.42, -q * 1.2, q * 0.42, -q * 0.6);
  bg2.addColorStop(0, IQ.shade(col, 0.3)); bg2.addColorStop(1, IQ.shade(col, -0.15));
  ctx.fillStyle = bg2; ctx.strokeStyle = OL; ctx.lineWidth = lw;
  IQ.roundRect(ctx, -q * 0.44, -q * 1.18, q * 0.88, q * 0.52, q * 0.22); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `900 ${q * 0.32}px Pretendard, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('1', 0, -q * 0.9);
  arm(-1); arm(1);
  // 머리
  const hy = -q * 1.62, hr = q * 0.6;
  if (style === 2) { ctx.fillStyle = hair; ctx.beginPath(); ctx.ellipse(-hr * 0.85, hy + hr * 0.3, hr * 0.3, hr * 0.5, -0.3, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(hr * 0.85, hy + hr * 0.3, hr * 0.3, hr * 0.5, 0.3, 0, 7); ctx.fill(); }
  const hg = ctx.createRadialGradient(-hr * 0.3, hy - hr * 0.3, hr * 0.1, 0, hy, hr);
  hg.addColorStop(0, '#ffe8d2'); hg.addColorStop(1, '#f6c9a2');
  ctx.fillStyle = hg; ctx.strokeStyle = OL; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.arc(0, hy, hr, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = style === 3 ? IQ.shade(col, -0.25) : hair;
  ctx.beginPath();
  if (style === 1) {
    ctx.moveTo(-hr * 1.02, hy - hr * 0.05);
    for (let k = 0; k <= 6; k++) { const a = Math.PI + k / 6 * Math.PI, rr = k % 2 ? hr * 1.28 : hr * 1.02; ctx.lineTo(Math.cos(a) * rr, hy + Math.sin(a) * rr * 0.95 - hr * 0.05); }
    ctx.quadraticCurveTo(0, hy - hr * 0.35, -hr * 1.02, hy - hr * 0.05);
  } else if (style === 3) { // 모자 (정면이라 챙이 가운데)
    ctx.arc(0, hy - hr * 0.08, hr * 1.04, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, hy - hr * 0.12, hr * 0.8, hr * 0.14, 0, 0, 7);
  } else {
    ctx.arc(0, hy - hr * 0.05, hr * 1.06, Math.PI * 0.98, Math.PI * 2.02);
    ctx.quadraticCurveTo(hr * 0.5, hy - hr * 0.25, 0, hy - hr * 0.42);
    ctx.quadraticCurveTo(-hr * 0.5, hy - hr * 0.25, -hr * 1.04, hy + hr * (style === 2 ? 0.4 : 0.12));
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 얼굴
  const face = o.face || 'smile', look = (o.look || 0) * hr * 0.1, blink = face === 'smile' && ((t + (h % 50) / 10) % 4.2) < 0.12;

    if (face === 'ouch') { ctx.lineWidth = Math.max(1.5, q * 0.06); ctx.beginPath(); ctx.moveTo(ex - hr * 0.1, ey - hr * 0.08); ctx.lineTo(ex + hr * 0.1, ey + hr * 0.08); ctx.moveTo(ex + hr * 0.1, ey - hr * 0.08); ctx.lineTo(ex - hr * 0.1, ey + hr * 0.08); ctx.stroke(); continue; }
    if (blink) { ctx.fillRect(ex - hr * 0.1, ey, hr * 0.2, hr * 0.04); continue; }
    ctx.beginPath(); ctx.ellipse(ex, ey, hr * 0.11, hr * 0.16, 0, 0, 7); ctx.fill();

  for (const k of [-1, 1]) { ctx.beginPath(); ctx.ellipse(k * hr * 0.52, hy + hr * 0.42, hr * 0.14, hr * 0.08, 0, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#7a3b2a'; ctx.fillStyle = '#7a3b2a'; ctx.lineWidth = Math.max(1, q * 0.05);
  ctx.beginPath();
  if (face === 'o' || face === 'ouch') { ctx.ellipse(look, hy + hr * 0.5, hr * 0.1, hr * 0.13, 0, 0, 7); ctx.fill(); }
  else if (face === 'happy') { ctx.arc(look, hy + hr * 0.36, hr * 0.2, 0.1 * Math.PI, 0.9 * Math.PI); ctx.closePath(); ctx.fill(); }

// 다른 학생 골키퍼 (작고 단순하게 — 60명이어도 가볍게)
function drawGhost(x, y, q, col) {

  ctx.strokeStyle = col; ctx.lineWidth = q * 0.16; ctx.beginPath(); ctx.moveTo(x - q * 0.66, y - q * 0.62); ctx.lineTo(x - q * 0.3, y - q * 1.0); ctx.lineTo(x + q * 0.3, y - q * 1.0); ctx.lineTo(x + q * 0.66, y - q * 0.62); ctx.stroke();
  ctx.fillStyle = col; IQ.roundRect(ctx, x - q * 0.42, y - q * 1.16, q * 0.84, q * 0.6, q * 0.2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - q * 0.68, y - q * 0.6, q * 0.17, 0, 7); ctx.arc(x + q * 0.68, y - q * 0.6, q * 0.17, 0, 7); ctx.fill();

/* ── 슈터 (섬 마스코트, 뒤에서 본 모습) ── */
const SHOOTER_NAME = { octo: '문어', crab: '꽃게', turtle: '바다거북', puffer: '복어' };
// (x,y)=발 기준점, m=크기, kk: -1..0 와인드업, 0..1 차고 난 뒤, t 시간
function drawShooter(kind, x, y, m, kk, t, alpha, flip) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); if (flip) ctx.scale(-1, 1); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const wind = kk < 0 ? Math.min(1, (kk + 1) / 1) : 0;         // 0→1 끌어당김
  const follow = kk >= 0 ? Math.min(1, kk / 0.25) : 0;          // 0→1 휘두름
  const fade = kk >= 0 ? Math.max(0, 1 - (kk - 0.25) / 0.75) : 1;
  const lean = kk < 0 ? -wind * 0.12 : (follow * 0.16) * fade;   // 앞으로 숙임 (화면 위쪽 = 앞)
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 0, m * 0.45, m * 0.08, 0, 0, 7); ctx.fill();
  // 차는 발 위치: 공 바로 뒤(오른쪽 위) → 와인드업 때 뒤로(아래로) → 찬 뒤 앞으로(위로)
  const rx = m * 0.32, ry = -m * 0.04;
  const fy = kk < 0 ? ry + wind * m * 0.2 : ry - (follow * 0.42 * fade) * m;
  const fx = rx + (kk < 0 ? wind * m * 0.06 : -follow * 0.05 * m * fade);
  const limb = (col, w) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(m * 0.12, -m * 0.3); ctx.quadraticCurveTo(m * 0.36, -m * 0.2 + (fy - ry) * 0.3, fx, fy); ctx.stroke(); };
  ctx.rotate(lean * 0.6);
  const bob = Math.sin(t * 5) * m * 0.01;
  if (kind === 'octo') {
    for (let i = 0; i < 7; i++) { // 다리
      const a = (i / 6 - 0.5) * 2.2, sw = Math.sin(t * 3 + i) * 0.1;
      const x0 = Math.sin(a) * m * 0.22, x1 = Math.sin(a) * m * 0.48 - m * 0.06;
      ctx.strokeStyle = '#c84439'; ctx.lineWidth = m * 0.075;
      ctx.beginPath(); ctx.moveTo(x0, -m * 0.3); ctx.quadraticCurveTo(x1 * (1 + sw), -m * 0.15, x1, -m * 0.01); ctx.stroke();
    }
    limb('#c84439', m * 0.09);
    const R = m * 0.3, hy = -m * 0.56 + bob;
    const gg = ctx.createRadialGradient(-R * 0.35, hy - R * 0.4, R * 0.1, 0, hy, R * 1.1); gg.addColorStop(0, '#ff9e8f'); gg.addColorStop(1, '#de5548');
    ctx.fillStyle = gg; ctx.strokeStyle = 'rgba(90,20,20,.45)'; ctx.lineWidth = m * 0.012;
    ctx.beginPath(); ctx.ellipse(0, hy, R, R * 1.05, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(160,40,40,.25)';
    for (const [sx, sy, r] of [[-0.4, -0.2, 0.12], [0.3, -0.35, 0.09], [0.1, 0.15, 0.14], [-0.15, 0.45, 0.08], [0.45, 0.25, 0.1]]) { ctx.beginPath(); ctx.arc(sx * R, hy + sy * R, r * R, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#123b66'; ctx.beginPath(); ctx.ellipse(0, hy - R * 0.82, R * 0.62, R * 0.2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-R * 0.56, hy - R * 0.98, R * 1.12, R * 0.12);
    ctx.fillStyle = '#123b66'; ctx.beginPath(); ctx.ellipse(0, hy - R * 1.04, R * 0.5, R * 0.18, 0, Math.PI, 0); ctx.fill();
  } else if (kind === 'crab') {
    ctx.strokeStyle = '#c4381e'; ctx.lineWidth = m * 0.045;
    for (const k of [-1, 1]) for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(k * m * 0.18, -m * 0.2); ctx.lineTo(k * m * (0.36 + i * 0.06), -m * (0.14 - i * 0.03)); ctx.lineTo(k * m * (0.42 + i * 0.06), -m * 0.01); ctx.stroke(); }
    limb('#c4381e', m * 0.055);
    const up = kk < 0 ? -wind * 0.1 : -0.15 * fade;
    for (const k of [-1, 1]) {
      ctx.fillStyle = '#e8532f'; ctx.beginPath(); ctx.ellipse(k * m * 0.38, -m * (0.42 - up), m * 0.12, m * 0.09, k * 0.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff7a52'; ctx.beginPath(); ctx.ellipse(k * m * 0.42, -m * (0.47 - up), m * 0.065, m * 0.04, k * 0.5, 0, 7); ctx.fill();
    }
    const gg = ctx.createRadialGradient(-m * 0.08, -m * 0.38, m * 0.04, 0, -m * 0.3, m * 0.36); gg.addColorStop(0, '#ff8a5c'); gg.addColorStop(1, '#d13d1c');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(0, -m * 0.3 + bob, m * 0.3, m * 0.18, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(120,20,10,.25)'; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * m * 0.09, -m * 0.33 + Math.abs(i) * m * 0.015, m * 0.025, 0, 7); ctx.fill(); }
    for (const k of [-1, 1]) { // 눈자루 (뒤에서 보여도 위로 솟음)
      ctx.strokeStyle = '#c4381e'; ctx.lineWidth = m * 0.035; ctx.beginPath(); ctx.moveTo(k * m * 0.08, -m * 0.44); ctx.lineTo(k * m * 0.1, -m * 0.58); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(k * m * 0.1, -m * 0.61, m * 0.055, 0, 7); ctx.fill();
    }
  } else if (kind === 'turtle') {
    for (const k of [-1, 1]) { ctx.fillStyle = '#6fbf73'; ctx.beginPath(); ctx.ellipse(k * m * 0.3, -m * 0.05, m * 0.1, m * 0.06, k * 0.4, 0, 7); ctx.fill(); }
    limb('#6fbf73', m * 0.1);
    ctx.fillStyle = '#7fd08a'; ctx.beginPath(); ctx.ellipse(0, -m * 0.62 + bob, m * 0.13, m * 0.12, 0, 0, 7); ctx.fill(); // 머리 (뒤통수)
    for (const k of [-1, 1]) { ctx.fillStyle = '#6fbf73'; ctx.beginPath(); ctx.ellipse(k * m * 0.36, -m * 0.4, m * 0.16, m * 0.07, -k * 0.6, 0, 7); ctx.fill(); }
    const gg = ctx.createRadialGradient(-m * 0.1, -m * 0.45, m * 0.04, 0, -m * 0.33, m * 0.38); gg.addColorStop(0, '#5aa36a'); gg.addColorStop(1, '#245c3a');
    ctx.fillStyle = gg; ctx.strokeStyle = '#173d26'; ctx.lineWidth = m * 0.02;
    ctx.beginPath(); ctx.ellipse(0, -m * 0.34 + bob, m * 0.33, m * 0.27, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,240,190,.45)'; ctx.lineWidth = m * 0.014;
    const hex = (cx, cy, r) => { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + Math.PI / 6; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.8); } ctx.closePath(); ctx.stroke(); };
    hex(0, -m * 0.36 + bob, m * 0.09); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; hex(Math.cos(a) * m * 0.19, -m * 0.36 + bob + Math.sin(a) * m * 0.14, m * 0.07); }
  } else { // puffer
    limb('#f0b429', m * 0.07);
    ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.moveTo(0, -m * 0.12); ctx.lineTo(-m * 0.1, m * 0.0); ctx.lineTo(m * 0.1, m * 0.0); ctx.closePath(); ctx.fill(); // 꼬리
    const R = m * 0.3, cy = -m * 0.4 + bob + Math.sin(t * 4) * m * 0.015;
    ctx.fillStyle = '#e8a21c';
    for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(Math.cos(a - 0.12) * R * 0.95, cy + Math.sin(a - 0.12) * R * 0.95); ctx.lineTo(Math.cos(a) * R * 1.22, cy + Math.sin(a) * R * 1.22); ctx.lineTo(Math.cos(a + 0.12) * R * 0.95, cy + Math.sin(a + 0.12) * R * 0.95); ctx.fill(); }
    const gg = ctx.createRadialGradient(-R * 0.3, cy - R * 0.4, R * 0.1, 0, cy, R); gg.addColorStop(0, '#ffe9a3'); gg.addColorStop(1, '#f2b01e');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, cy, R, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(160,100,10,.35)'; for (const [sx, sy] of [[-0.4, -0.1], [0.3, -0.3], [0.05, 0.25], [-0.2, -0.45], [0.45, 0.15]]) { ctx.beginPath(); ctx.arc(sx * R, cy + sy * R, R * 0.08, 0, 7); ctx.fill(); }
    for (const k of [-1, 1]) { ctx.fillStyle = '#ffcf5a'; ctx.beginPath(); ctx.ellipse(k * R * 1.02, cy + R * 0.1, R * 0.2, R * 0.12, k * 0.5 + Math.sin(t * 10) * 0.2, 0, 7); ctx.fill(); }
  }
  ctx.restore();
  // 이름표
  ctx.save(); ctx.globalAlpha = alpha * 0.9;
  const fs = Math.max(10, m * 0.085); ctx.font = `900 ${fs}px Pretendard, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lab = SHOOTER_NAME[kind] + ' 선수', tw = ctx.measureText(lab).width + fs;
  const ly = y - m * 0.9;
  ctx.fillStyle = 'rgba(6,30,52,.8)'; IQ.roundRect(ctx, x - tw / 2, ly - fs * 0.75, tw, fs * 1.5, fs * 0.75); ctx.fill();
  ctx.fillStyle = '#ffe15a'; ctx.fillText(lab, x, ly);
  ctx.restore();
}

/* ── 공 ── */
const ARRIVE_H = 0.13;   // 화면용: 도착할 때 장갑 높이로 들어오게 살짝 띄움 (판정은 x 만 씀)
function ballScreen(s, t) {
  const b = BK.ballAt(s, t);
  const hv = b.h + ARRIVE_H * b.u * b.u;
  return { x: PX(b.x, b.u), y: PY(b.u, hv), gy: PY(b.u, 0), r: GH * BK.BR * 1.35 * Math.pow(scl(b.u), 1.6), u: b.u, wx: b.x };
}
// yellow: 바나나킥 공(노란 공), 아니면 흰 공
function drawBall(X, Y, r, spin, alpha, yellow) {
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.translate(X, Y);
  const gg = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  if (yellow) { gg.addColorStop(0, '#fff7c2'); gg.addColorStop(0.7, '#ffd93b'); gg.addColorStop(1, '#c79a00'); }
  else { gg.addColorStop(0, '#ffffff'); gg.addColorStop(0.7, '#e8eef4'); gg.addColorStop(1, '#9aa8b8'); }
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip();
  ctx.fillStyle = yellow ? '#5b4a00' : '#1b2433';
  for (let i = 0; i < 4; i++) { const a = spin + i * Math.PI / 2, d = r * (i === 0 ? 0.05 : 0.68); const px = Math.cos(a) * d, py = Math.sin(a) * d * 0.9; ctx.beginPath(); for (let k = 0; k < 5; k++) { const b2 = a + k * Math.PI * 0.4; ctx.lineTo(px + Math.cos(b2) * r * 0.27, py + Math.sin(b2) * r * 0.27); } ctx.fill(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(1, r * 0.08); ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.restore();
}
function trailColor(s, u) { return s.kind === 'knuckle' && u > (s.s || 0.7) ? '255,90,200' : s.kind === 'banana' ? '255,225,90' : '190,240,255'; }
function drawTrail(s, t) {
  const T = s.t1 - s.t0, b = BK.ballAt(s, t); if (b.u <= 0.02) return;
  const N = 12, span = 0.32;
  let prev = null;
  for (let i = 0; i <= N; i++) {
    const uu = Math.max(0, b.u - span + span * i / N), p = ballScreen(s, s.t0 + uu * T);
    if (prev) { ctx.strokeStyle = `rgba(${trailColor(s, uu)},${(0.55 * i / N).toFixed(3)})`; ctx.lineWidth = Math.max(1.5, p.r * 1.1 * i / N); ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    prev = p;
  }
}

/* ── 연습용 공 (대기실, 판정 없음) ── */
let demo = null, demoN = 0;
function nextDemo(now) {
  const x1 = (Math.random() * 2 - 1) * 0.8, A = (Math.random() < 0.5 ? -1 : 1) * (0.1 + Math.random() * 0.25);
  demo = { id: 'demo' + (++demoN), demo: true, shooter: ['octo', 'crab', 'turtle', 'puffer'][demoN % 4], t0: now + 1500, t1: now + 1500 + 1750, x0: +(Math.random() * 1.4 - 0.7).toFixed(2), x1, A, dx: 0, s: 0.7, lob: 0.3, kind: Math.abs(A) > 0.05 ? 'banana' : 'straight', kicked: false, pred: false };
}

/* ── 결과 연출 ── */
function showResult(s, code, now) {
  const quiet = s.quiet || document.hidden;
  const gx = g.at(s.t1).x;
  s.gx = gx;
  if (s.demo) {
    if (!quiet && practiced) { if (code) { fx('연습 OK!', 'small', '좋아요! 이 느낌이에요'); sfx('soft'); burst(PX(gx, 1), PY(1, 0.15), 10, PAL_NEON, 0.7); } else fx('아깝다!', 'small', '공 아래로 가 보세요'); }
    return;
  }
  stats.pred++;
  if (code > 0) {
    myCombo++;
    const pts = 100 + (code === 2 ? 50 : 0) + Math.min(myCombo, 10) * 5;
    pendPts.set(s.id, pts);
    if (!quiet) {
      const X = PX(s.bxLocal, 1), Y = PY(1, ARRIVE_H);
      if (code === 2) { fx('WOW!', 'wow', `+${pts} · 정중앙!`); flash('gold'); burst(X, Y, 34, PAL_GOLD, 1.2, 300, true); sfx('wow'); buzz([25, 35, 25, 35, 60]); }
      else { fx('OK!', 'ok', `+${pts}`); flash('green'); burst(X, Y, 14, PAL_GREEN, 0.8); sfx('save'); buzz(25); }
      if (myCombo >= 5 && myCombo % 5 === 0) setTimeout(() => comboFlair(myCombo), 250);
      restart($('#combo'), 'pulse');
    }
  } else {
    myCombo = 0;
    const out = phase.mode === 'out';
    if (!quiet) {
      fx('GOAL…', 'goal', out ? '' : '콤보가 끊겼어요'); flash(); shake = 1; sfx('goal'); buzz(out ? [380, 90, 520] : 300);
    }
    if (out) { localOut = true; if (!quiet) setTimeout(() => { if (localOut) eliminated(); }, 450); else outAt = performance.now() - 5000; }
  }
  renderUI();
}

/* ── 그리기 루프 ── */
let shake = 0, lastFrame = performance.now(), shooterX = null, shooterFlip = false, chipT = 0;
function frame() {
  requestAnimationFrame(frame);
  if (!joined || document.hidden) return;
  try { draw(); } catch (e) { report('draw ' + (e && e.stack || e)); }
}
// 판정·기록 정리는 화면 그리기(rAF)와 따로 돌림 → 화면이 느리거나 멈춰도 예측·골키퍼 계산이 정확
let syncShown = null;
function logic() {
  if (!joined) return;
  const ph = phase.phase;
  // 서버 시계가 처음 맞춰지면 내 골키퍼 기준 시각도 서버 시계로
  if (clock.ready && !wasReady) { wasReady = true; dirNow = 0; ptrs.clear(); keys.L = keys.R = false; padVisual(); g.reset(clock.now()); if (joined && !joinSrvT) joinSrvT = clock.now(); needReset = false; }
  if (needReset && clock.ready) { g.reset(clock.now()); needReset = false; }
  if (syncShown !== clock.ready) { syncShown = clock.ready; $('#syncTag').classList.toggle('hidden', clock.ready); }
  const now = clock.now(), pnow = performance.now();
  compactSafe(now);
  // 연습 공 (대기실에서만)
  if (ph === 'lobby' && !isOut() && !document.hidden) { if (!demo || now > demo.t1 + 1300) nextDemo(now); } else if (ph !== 'lobby') demo = null;
  // 슛 진행: 차기 소리, 도착 순간 판정 예측
  for (const s of shots.values()) tickShot(s, now, pnow, ph);
  if (demo) tickShot(demo, now, pnow, ph);
}
function tickShot(s, now, pnow, ph) {
  if (!s.kicked && now >= s.t0) { s.kicked = true; if (now - s.t0 < 250 && !document.hidden && (ph === 'play' || s.demo) && pnow - lastKickSnd > 80) { lastKickSnd = pnow; sfx('kick'); } }
  if (!s.pred && now >= s.t1) {
    s.pred = true;
    const bx = BK.ballAt(s, s.t1).x; s.bxLocal = bx;
    const part = s.demo ? true : (me && ph === 'play' && clock.ready && !isOut() && (myInfo() || {}).state === 'in');
    if (part) { s.local = BK.judge(g.at(s.t1).x, bx); if (now - s.t1 > 400 || document.hidden) s.quiet = true; showResult(s, s.local, now); }
  }
  if (!s.demo && now > s.t1 + 3000) shots.delete(s.id);
}
setInterval(() => { try { logic(); } catch (e) { report('logic ' + (e && e.stack || e)); } }, 16);
function draw() {
  const pnow = performance.now(), dt = Math.min(0.05, (pnow - lastFrame) / 1000); lastFrame = pnow;
  const ts = pnow / 1000, ph = phase.phase;
  logic();
  const now = clock.now();
  const me1 = g.at(now);
  if (pnow - chipT > 250) { chipT = pnow; updateChip(); }

  // 카운트다운
  const cEl = $('#count');
  if (ph === 'ready' || (ph === 'play' && lastCount && lastCount !== 'done')) {
    const remain = ph === 'play' ? -1 : (clock.ready && readyAtSrv ? readyAtSrv - now : readyAtLocal - pnow);
    let txt = remain > 3000 ? '준비!' : remain > 0 ? String(Math.ceil(remain / 1000)) : '킥오프!';
    if (ph === 'play' && lastCount === '킥오프!' && cEl._goAt && pnow - cEl._goAt > 1000) txt = 'done';
    if (txt !== lastCount) {
      lastCount = txt;
      if (txt === 'done') cEl.textContent = '';
      else { cEl.textContent = txt; cEl.classList.toggle('go', txt === '킥오프!'); restart(cEl, 'tick'); if (txt === '킥오프!') { cEl._goAt = pnow; sfx('whistle'); buzz(60); } else if (txt !== '준비!') { sfx('count'); buzz(25); } }
    }
  } else if (cEl.textContent && ph !== 'ready') { cEl.textContent = ''; lastCount = ph === 'play' ? 'done' : ''; }

  const list = [...shots.values()]; if (demo) list.push(demo);

  // ── 장면 ──
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  let ox = 0, oy = 0;
  if (shake > 0.01) { ox = (Math.random() - 0.5) * shake * GH * 0.08; oy = (Math.random() - 0.5) * shake * GH * 0.06; shake *= Math.exp(-dt * 7); } else shake = 0;
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.translate(ox, oy);
  const out = isOut();

  // 그물에 들어간 공 (골키퍼 뒤)
  const after = [];
  for (const s of list) {
    if (now < s.t1) continue;
    const el = now - s.t1, saved = (s.final != null ? s.final : s.local) > 0;
    if (s.local == null && s.final == null && !s.demo) { // 내 판정이 없는 공(관전·대기): 그물로
      drawNetBall(s, el); continue;
    }
    if (saved) after.push(s); else drawNetBall(s, el);
  }
  // 다른 학생 골키퍼 (흐릿하게, 골대 안쪽)
  if (ghosts.size && me) {
    IQ.stepInterp(ghosts, dt);
    const gq = Q * (out ? 0.85 : 0.62) * scl(1.08), gy = PY(1.08, 0);
    ctx.globalAlpha = out ? 0.55 : 0.22;
    for (const [id, e] of ghosts) {
      if (id === me.id || !e.alive || e.x == null) continue;
      const p = roster.get(id); drawGhost(PX(e.x, 1.08), gy, gq, (p && p.color) || '#9ab');
    }
    ctx.globalAlpha = 1;
  }
  // 내 골키퍼
  const gxs = PX(me1.x, 1), gys = PY(1, 0);
  if (me && !(out && !outAt)) {               // 늦게 들어와 관전만 하는 학생은 내 골키퍼를 그리지 않음
    // 다가오는 공 (반응 연출용)
    let near = null; for (const s of list) { if (now < s.t1 && now > s.t1 - 260 && (!near || s.t1 < near.t1)) near = s; }
    let reach = 0, face = 'smile', look = 0, catchA = 0;
    if (near) { const bx = BK.ballAt(near, near.t1).x, d = bx - me1.x; look = Math.max(-1, Math.min(1, d * 3)); if (Math.abs(d) < BK.REACH + 0.05) reach = Math.sign(d || 1) * Math.min(1, Math.abs(d) / BK.REACH) * (1 - (near.t1 - now) / 260); face = 'o'; }
    let lastRes = null; for (const s of list) { if (s.local != null && now >= s.t1 && now - s.t1 < 800 && (!lastRes || s.t1 > lastRes.t1)) lastRes = s; }
    if (lastRes) { const code = lastRes.final != null ? lastRes.final : lastRes.local; face = code > 0 ? 'happy' : 'ouch'; if (code > 0) catchA = Math.max(0, 1 - (now - lastRes.t1) / 400); }
    const lean = Math.max(-0.22, Math.min(0.22, me1.v / BK.V * 0.2));
    // 막을 수 있는 범위 그림자
    ctx.fillStyle = out ? 'rgba(0,0,0,.2)' : 'rgba(127,232,255,.16)';
    ctx.beginPath(); ctx.ellipse(gxs, gys, BK.REACH * GH, GH * 0.035, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(gxs, gys, BK.GW * GH * 0.8, GH * 0.025, 0, 0, 7); ctx.fill();
    const col = (myInfo() || me).color || me.color, alpha = out ? (outAt && pnow - outAt < 2500 ? 1 : 0.35) : 1;
    drawKeeper(gxs, gys, Q, col, me.name || col, ts, { moving: Math.abs(me1.v) > 0.08, lean, reach, face: out ? 'ouch' : face, look, catch: catchA, alpha });
    // 내 이름표 (발 아래)
    const fs = Math.max(11, Q * 0.42); ctx.font = `900 ${fs}px Pretendard, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const nm = me.name || '', tw = ctx.measureText(nm).width + fs, ty = gys + fs * 1.0;
    ctx.globalAlpha = alpha; ctx.fillStyle = '#0b2a4a'; IQ.roundRect(ctx, gxs - tw / 2, ty - fs * 0.72, tw, fs * 1.44, fs * 0.72); ctx.fill();
    ctx.strokeStyle = '#ffe15a'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = '#ffe15a'; ctx.fillText(nm, gxs, ty + 1); ctx.globalAlpha = 1;
  }
  // 막은 공 (장갑에 잡혔다가 튕겨 나감)
  for (const s of after) drawSavedBall(s, now - s.t1, s.gx != null ? s.gx : me1.x);

  // 슈터
  let nextS = null, lastK = null;
  for (const s of list) { if (now < s.t0) { if (!nextS || s.t0 < nextS.t0) nextS = s; } else if (!lastK || s.t0 > lastK.t0) lastK = s; }
  let sh = null, kk = 0, alpha = 0;
  if (lastK && now - lastK.t0 < 650 && (!nextS || nextS.t0 - now > 450)) { sh = lastK; kk = (now - lastK.t0) / 650; alpha = Math.min(1, 1.6 - kk * 1.2); }
  else if (nextS && nextS.t0 - now < 1500) { sh = nextS; kk = Math.max(-1, -(nextS.t0 - now) / 450); alpha = Math.min(1, (1500 - (nextS.t0 - now)) / 300); }
  // 공 (날아오는 중 · 차기 전에는 발 앞)
  const flying = [];
  for (const s of list) { if (now < s.t1 && (now >= s.t0 || s === nextS)) flying.push(s); }
  flying.sort((a, b) => BK.ballAt(b, now).u - BK.ballAt(a, now).u); // 먼 공부터
  if (sh) {
    const bp = ballScreen(sh, sh.t0), m = GH * 0.95;
    const flip = bp.x < CX;                      // 공이 왼쪽이면 공 오른쪽에 서서 왼발로 (화면 밖으로 잘리지 않게)
    const target = bp.x + (flip ? 1 : -1) * m * 0.36;
    if (shooterX == null || alpha < 0.05 || shooterFlip !== flip) shooterX = target; else shooterX += (target - shooterX) * (1 - Math.exp(-dt * 14));
    shooterFlip = flip;
    drawShooter(sh.shooter, shooterX, bp.gy + m * 0.05, m, kk, ts, Math.max(0, alpha) * (sh.demo ? 0.8 : 1), flip);
  } else shooterX = null;
  for (const s of flying) {
    const p = ballScreen(s, now), T = s.t1 - s.t0, u = p.u;
    // 그림자
    ctx.fillStyle = `rgba(0,0,0,${(0.25 + 0.15 * (1 - u)).toFixed(3)})`; ctx.beginPath(); ctx.ellipse(p.x, p.gy, p.r * 1.0, p.r * 0.32, 0, 0, 7); ctx.fill();
    if (now >= s.t0) drawTrail(s, now);
    // 너클볼: 꺾이는 순간 반짝
    if (s.kind === 'knuckle' && s.dx) { const sw = s.s || 0.7; if (u > sw - 0.04 && u < sw + 0.12) { const a = 1 - Math.abs(u - (sw + 0.03)) / 0.1; ctx.strokeStyle = `rgba(255,90,200,${Math.max(0, a).toFixed(3)})`; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.2, 0, 7); ctx.stroke(); } }
    const spin = (now >= s.t0 ? (now - s.t0) / 1000 : 0) * (8 + Math.abs(s.A || 0) * 30) * (s.A < 0 ? -1 : 1);
    drawBall(p.x, p.y, p.r, spin, s.demo ? 0.75 : 1, s.kind === 'banana');
    // 곧 도착: 골라인 위 도착 지점 표시 없음 (스스로 읽기) — 대신 마지막 순간 반짝
    if (T > 0 && s.t1 - now < 120 && !s.demo) { ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.5, 0, 7); ctx.stroke(); }
  }
  // 파티클
  for (const p of parts) {
    if (p.life <= 0) continue;
    p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c;
    if (p.star) { starPath(p.x, p.y, p.r); ctx.fill(); } else ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  if (out && outAt && pnow - outAt > 2500 && $('#specTag').classList.contains('hidden')) renderUI();
}
function drawNetBall(s, el) {
  if (el > 1600) return;
  const bx = s.bx != null ? s.bx : BK.ballAt(s, s.t1).x;
  const k = Math.min(1, el / 260), uu = 1 + (NETD - 1.02) * (1 - (1 - k) * (1 - k));
  const ex = bx + ((s.A || 0) * 0.15 + (s.x1 - s.x0) * 0.04) * k;
  const hv = ARRIVE_H * (1 - k * 0.6) + Math.sin(Math.PI * k) * 0.04;
  const X = PX(ex, uu), Y = PY(uu, hv), r = GH * BK.BR * 1.35 * Math.pow(scl(uu), 1.6);
  const a = el < 1100 ? 1 : 1 - (el - 1100) / 500;
  if (el < 500) { // 그물 출렁임
    const rr = r * (2 + 4 * k); ctx.strokeStyle = `rgba(200,240,255,${(0.5 * (1 - el / 500)).toFixed(3)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(X, Y, rr, rr * 0.7, 0, 0, 7); ctx.stroke();
  }
  drawBall(X, Y + (el > 300 ? Math.min(1, (el - 300) / 300) * (PY(uu, 0) - Y) : 0), r, el / 200, Math.max(0, a) * (s.demo ? 0.75 : 1), s.kind === 'banana');
}
function drawSavedBall(s, el, gx) {
  if (el > 1100) return;
  const bx = s.bx != null ? s.bx : (s.bxLocal != null ? s.bxLocal : BK.ballAt(s, s.t1).x);
  const hold = 180, X0 = PX(bx, 1), Y0 = PY(1, ARRIVE_H);
  let X = X0, Y = Y0, r = GH * BK.BR * 1.35, a = 1;
  if (el > hold) { // 튕겨 나감 (옆·앞으로)
    const k = (el - hold) / 900, side = bx >= gx ? 1 : -1;
    X = X0 + side * k * GH * 0.9; Y = Y0 - Math.sin(Math.PI * Math.min(1, k * 1.2)) * GH * 0.35 + k * k * GH * 0.5; r *= 1 + k * 0.5; a = 1 - k;
  } else if (el < 120) { ctx.fillStyle = `rgba(255,255,255,${(0.6 * (1 - el / 120)).toFixed(3)})`; ctx.beginPath(); ctx.arc(X, Y, r * 2.4, 0, 7); ctx.fill(); }
  drawBall(X, Y, r, el / 120, Math.max(0, a) * (s.demo ? 0.75 : 1), s.kind === 'banana');
}
requestAnimationFrame(frame);
