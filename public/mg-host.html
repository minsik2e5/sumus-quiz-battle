<!doctype html>
<html lang="ko">
<head>
<script>if(!sessionStorage.getItem('sumus-sess')&&!/[?&]edit=1/.test(location.search))location.replace('/?need=1');</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMUS ISLAND PART 2 — 무궁화 꽃이 피었습니다</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0b2a4a;--gold:#f2c14e;--gold2:#d9a21b;--muted:#6b7c93;--line:#dde5ee;--red:#e2364f;--green:#1fb36b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0f5e93;color:#13233a}
button{font:inherit;cursor:pointer;border:0}
select{font:inherit}
.hidden{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%}
.chip{background:rgba(11,42,74,.86);color:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:clamp(13px,1.2vw,21px);display:flex;align-items:center;gap:8px}
.chip b{color:var(--gold)}
#hudL{position:fixed;left:20px;top:18px;display:flex;gap:8px;z-index:5}
#hudR{position:fixed;right:18px;top:18px;display:flex;gap:8px;z-index:5}
.ibtn{width:42px;height:42px;border-radius:12px;background:rgba(11,42,74,.7);color:#fff;font-size:17px;display:grid;place-items:center}
#ctrl{position:fixed;left:20px;bottom:18px;display:flex;gap:8px;z-index:6}
.btn{padding:11px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:#2b1d00;border-color:var(--gold)}

/* 설정 */
#setup{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:rgba(6,26,48,.35)}
.card{background:#fff;border-radius:26px;border:6px solid var(--gold);box-shadow:0 10px 0 var(--gold2),0 30px 60px rgba(0,0,0,.3);padding:28px 30px;width:min(520px,92vw)}
.card h1{margin:0;font-size:15px;color:var(--muted);font-weight:800;letter-spacing:.5px}
.card h2{margin:4px 0 18px;font-size:30px;font-weight:900;color:var(--navy);letter-spacing:-.5px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:11px 8px;border-radius:12px;background:#eef2f7;font-weight:800;color:var(--navy);font-size:14px}
.seg button.on{background:var(--navy);color:#fff}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px}
.go{width:100%;padding:16px;border-radius:14px;background:var(--gold);color:#2b1d00;font-weight:900;font-size:19px;margin-top:6px}

/* 대기실 */
#lobby{position:fixed;left:2vw;top:11vh;bottom:4vh;width:min(28vw,460px);z-index:6;background:#fff;border-radius:24px;border:6px solid var(--gold);box-shadow:0 10px 0 var(--gold2);padding:2.2vh 1.6vw;display:flex;flex-direction:column;gap:1.2vh}
#lobby .t{font-weight:900;font-size:clamp(17px,1.5vw,28px);color:var(--navy)}
#lobby .join{display:flex;gap:1vw;align-items:center}
#lobby .qr{width:clamp(110px,10vw,200px);height:clamp(110px,10vw,200px);border-radius:12px;border:1px solid var(--line);image-rendering:pixelated}
#lobby .lbl{font-size:clamp(11px,.9vw,15px);color:var(--muted);font-weight:700}
#lobby .pin{font-weight:900;font-size:clamp(44px,4.6vw,90px);letter-spacing:4px;color:var(--navy);line-height:1}
#lobby .url{font-weight:800;font-size:clamp(11px,.9vw,16px);color:#123b66;word-break:break-all;margin-top:.5vh}
#lobby .meta{font-size:clamp(12px,1vw,17px);font-weight:800;display:flex;justify-content:space-between}
#plist{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;border-top:1px solid var(--line);padding-top:1vh}
.pc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;font-weight:700;font-size:clamp(11px,.9vw,15px);background:#fff}
.pc i{width:13px;height:13px;border-radius:50%}
.pc.off{opacity:.45}
#lobby .row{display:flex;gap:8px}
#lobby .start{flex:1;padding:1.7vh;border-radius:16px;background:var(--navy);color:#fff;font-weight:900;font-size:clamp(17px,1.5vw,26px)}
#lobby .small{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#lobby .small button{background:none;color:#123b66;font-weight:700;font-size:12px;padding:0;text-decoration:underline}

/* 카운트다운·배너 */
#big{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:8;font-weight:900;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25);font-size:clamp(80px,12vw,220px);pointer-events:none}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}

/* 결과 */
#end{position:fixed;inset:0;z-index:20;background:rgba(6,26,48,.78);display:grid;place-items:center;color:#fff;text-align:center}
#end h1{font-size:clamp(34px,4vw,70px);margin:0 0 2vh;color:var(--gold);font-weight:900}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:1.4vw;margin-bottom:2.5vh}
.pod{width:clamp(130px,13vw,230px)}
.pod .nm{font-weight:900;font-size:clamp(18px,1.7vw,32px);margin-bottom:.8vh;word-break:keep-all}
.pod .blk{border-radius:16px 16px 0 0;background:#fff;color:var(--navy);font-weight:900;font-size:clamp(34px,3.2vw,60px);display:grid;place-items:center}
.pod.r1 .blk{background:var(--gold);height:24vh}.pod.r2 .blk{height:16vh}.pod.r3 .blk{height:11vh;background:#ffd9b0}
.lists{display:flex;gap:2vw;justify-content:center;margin-bottom:3vh;max-width:90vw}
.lists > div{max-width:42vw}
.lists h3{margin:0 0 1vh;font-size:clamp(14px,1.2vw,20px);color:#c9d7ea}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:22vh;overflow:auto}
.tags span{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
#end .row{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hudL" class="hidden">
  <div class="chip">방 <b id="hPin">----</b></div>
  <div class="chip" id="hLv">LEVEL 1</div>
  <div class="chip" id="hTime">2:00</div>
</div>
<div id="hudR">
  <div class="chip hidden" id="hCnt"></div>
  <button class="ibtn" id="muteBtn" title="소리">🔊</button>
  <button class="ibtn" id="fsBtn" title="전체 화면">⛶</button>
</div>

<div id="ctrl" class="hidden">
  <button class="btn" id="stopBtn">그만하고 결과 보기</button>
  <button class="btn" id="resetBtn">처음으로</button>
</div>

<div id="big" class="hidden"></div>

<section id="setup">
  <div class="card">
    <h1>SUMUS ISLAND · PART 2</h1>
    <h2>무궁화 꽃이 피었습니다</h2>
    <div class="field"><label>잡히면</label>
      <div class="seg" id="sMode"><button data-v="out" class="on">탈락</button><button data-v="back">출발선으로</button></div>
      <div class="hint" id="modeHint"></div></div>
    <div class="field"><label>제한 시간</label>
      <div class="seg" id="sTime"><button data-v="60">1분</button><button data-v="90">1분 30초</button><button data-v="120" class="on">2분</button><button data-v="180">3분</button></div></div>
    <div class="field"><label>시작 난이도 (두 바퀴마다 한 단계씩 올라감, 최대 5)</label>
      <div class="seg" id="sLv"><button data-v="1" class="on">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div>
      <div class="hint">3단계부터 꽃게 술래가 나와서 외치는 도중에 힐끔 봅니다. 4단계부터는 돌아봤다가 다시 홱 돌아보기도 합니다.</div></div>
    <button class="go" id="openBtn">방 열기</button>
  </div>
</section>

<section id="lobby" class="hidden">
  <div class="t">휴대폰으로 들어오세요</div>
  <div class="join"><img class="qr" id="qr" alt="QR">
    <div><div class="lbl">방 번호</div><div class="pin" id="lPin">----</div><div class="url" id="lUrl"></div></div></div>
  <div class="meta"><span id="lCnt">0명 입장</span><span style="color:var(--muted)" id="lSet"></span></div>
  <div id="plist"></div>
  <div class="small">테스트: <button id="bot10">봇 10명 추가</button><button id="botClr">봇 지우기</button><span style="flex:1"></span><button id="cfgBtn">설정 바꾸기</button></div>
  <div class="row"><button class="start" id="startBtn">시작 <span style="font-size:.6em;opacity:.6">Space</span></button></div>
</section>

<section id="end" class="hidden">
  <div>
    <h1 id="endTitle">결과</h1>
    <div class="podium" id="podium"></div>
    <div class="lists"><div><h3 id="finH"></h3><div class="tags" id="finL"></div></div><div><h3 id="outH"></h3><div class="tags" id="outL"></div></div></div>
    <div class="row"><button class="btn gold" id="againBtn">한 판 더</button><button class="btn" id="setBtn">설정 바꾸기</button></div>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const KEY = 'sumus-mg';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SYL = ['무', '궁', '화', '꽃', '이', '피', '었', '습', '니', '다'];

/* ── 설정 ── */
const cfg = Object.assign({ mode: 'out', time: 120, level: 1 }, JSON.parse(localStorage.getItem(KEY + ':cfg') || '{}'));
function segBind(id, key) {
  const el = $(id);
  const paint = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(cfg[key]) === b.dataset.v));
  el.onclick = (e) => { const v = e.target.dataset.v; if (!v) return; cfg[key] = key === 'mode' ? v : +v; localStorage.setItem(KEY + ':cfg', JSON.stringify(cfg)); paint(); hint(); };
  paint();
}
function hint() { $('#modeHint').textContent = cfg.mode === 'out' ? '술래가 볼 때 움직이면 바다로 퐁당, 탈락입니다. 시간 안에 결승선을 넘은 사람만 통과.' : '잡혀도 탈락하지 않고 출발선으로 돌아갑니다. 처음 하는 반에 추천.'; }
segBind('#sMode', 'mode'); segBind('#sTime', 'time'); segBind('#sLv', 'level'); hint();

/* ── 소켓 ── */
const socket = io();
let room = null, phase = { phase: 'none' }, W8 = { main: 'back', syl: 0, crab: 'off', level: 1 }, roster = new Map(), players = new Map();
let endsAtLocal = 0, readyAtLocal = 0;
$('#openBtn').onclick = () => {
  $('#openBtn').disabled = true;
  if (room) { socket.emit('mg:config', cfg); $('#setup').classList.add('hidden'); $('#openBtn').disabled = false; onPhase(phase.phase); return; }
  socket.emit('mg:create', cfg, (r) => { $('#openBtn').disabled = false; if (!r.ok) return alert('방을 열지 못했습니다.'); room = r; sessionStorage.setItem(KEY + ':host', JSON.stringify(r)); setupJoin(r.pin); $('#setup').classList.add('hidden'); onPhase(phase.phase); });
};
socket.on('connect', () => {
  const saved = JSON.parse(sessionStorage.getItem(KEY + ':host') || 'null');
  if (!saved) return;
  socket.emit('mg:resume', saved, (r) => {
    if (r.ok) { room = saved; setupJoin(saved.pin); $('#setup').classList.add('hidden'); onPhase(phase.phase); return; }
    // 서버가 재시작됨 → 같은 번호로 다시 열기
    const sess = JSON.parse(sessionStorage.getItem('sumus-sess') || 'null'); // 수업 방이면 퀴즈쇼와 같은 번호로 다시 묶기
    socket.emit('mg:create', { ...cfg, pin: saved.pin, sk: sess && sess.pin === saved.pin ? sess.key : undefined }, (n) => { if (!n.ok) return; room = n; sessionStorage.setItem(KEY + ':host', JSON.stringify(n)); setupJoin(n.pin); $('#setup').classList.add('hidden'); onPhase(phase.phase);
      if (n.pin !== saved.pin) alert(`서버가 다시 시작되어 새 방을 열었습니다.\n새 방 번호: ${n.pin}\n학생들은 다시 입장해야 합니다.`); });
  });
});
async function setupJoin(pin) {
  let origin = location.origin;
  if (/^(localhost|127\.)/.test(location.hostname)) { try { const i = await (await fetch('/api/info')).json(); if (i.ips[0]) origin = `http://${i.ips[0]}:${location.port || 80}`; } catch (e) {} }
  const sess = JSON.parse(sessionStorage.getItem('sumus-sess') || 'null');
  const url = `${origin}/${sess && sess.pin === pin ? 'play' : 'm'}?pin=${pin}`; // 수업 방은 입장 주소 하나(/play)로 통일
  $('#qr').src = `/api/qr?text=${encodeURIComponent(url)}`; $('#lUrl').textContent = url.replace(/^https?:\/\//, '');
  $('#lPin').textContent = pin; $('#hPin').textContent = pin;
}
socket.on('mg:phase', (p) => { const prev = phase.phase; phase = p; endsAtLocal = performance.now() + p.remain; readyAtLocal = performance.now() + p.readyRemain; onPhase(prev); });
socket.on('mg:w', (w) => { const prev = W8; W8 = w; onWatch(prev); });
socket.on('mg:roster', (l) => { roster = new Map(l.map(p => [p.id, p])); renderRoster(); });
socket.on('mg:s', (arr, st) => {
  const seen = new Set(), nowMs = performance.now(); IQ.noteClock(typeof st === 'number' ? st : nowMs, nowMs);
  const t = typeof st === 'number' ? st : nowMs;
  for (let i = 0; i < arr.length; i += 4) {
    const id = arr[i], z = arr[i + 1] / 1000, x = arr[i + 2] / 1000, f = arr[i + 3]; seen.add(id);
    let e = players.get(id); if (!e) { e = { z, x, dz: z, sb: [] }; players.set(id, e); }
    const last = e.sb[e.sb.length - 1];
    if (last && z < last.z - 0.2) e.sb.length = 0; // 출발선으로 돌아간 경우 즉시 이동(연출은 따로)
    if (!last || t > last.t) e.sb.push({ t, z }); if (e.sb.length > 10) e.sb.shift();
    e.tz = z; e.x = x; e.run = !!(f & 1); e.out = !!(f & 2); e.fin = !!(f & 4);
  }
  for (const id of [...players.keys()]) if (!seen.has(id)) players.delete(id);
});
const fx = []; // 연출: 잡힘/통과
socket.on('mg:caught', ({ id, back }) => { const e = players.get(id); if (!e) return; fx.push({ type: back ? 'poof' : 'fall', id, z: e.dz, x: e.x, t0: performance.now() }); sfx(back ? 'boing' : 'buzz'); });
socket.on('mg:fin', ({ id, order }) => { fx.push({ type: 'fin', id, order, t0: performance.now() }); sfx('fin'); });

function onPhase(prev) {
  const p = phase.phase;
  $('#lobby').classList.toggle('hidden', p !== 'lobby' || !room);
  $('#hudL').classList.toggle('hidden', !room);
  $('#hCnt').classList.toggle('hidden', !(p === 'play' || p === 'ready'));
  $('#ctrl').classList.toggle('hidden', !(p === 'play' || p === 'ready'));
  $('#end').classList.toggle('hidden', p !== 'end');
  $('#hLv').textContent = `LEVEL ${phase.level || 1}`;
  $('#lSet').textContent = `${phase.mode === 'back' ? '출발선으로' : '탈락'} · ${Math.round(phase.timeLimit / 60 * 10) / 10}분 · ${phase.startLevel}단계부터`;
  if (p === 'ready' && prev !== 'ready') countdown();
  if (p === 'play' && prev === 'ready') showBig('시작!', 900);
  if (p === 'end') showEnd();
  if (p === 'lobby') fx.length = 0;
}
let lastLv = 1;
function onWatch(prev) {
  $('#hLv').textContent = `LEVEL ${W8.level}`;
  if (W8.level !== lastLv) { if (phase.phase === 'play' && W8.level > lastLv) { showBig(`LEVEL ${W8.level}`, 1100); sfx('lvup'); } lastLv = W8.level; }
  if (W8.main !== prev.main) { turnT0 = performance.now(); if (W8.main === 'turn') sfx('turn'); if (W8.main === 'look') sfx('look'); }
  if (W8.crab !== prev.crab) { crabT0 = performance.now(); if (W8.crab === 'warn') sfx('warn'); if (W8.crab === 'look') sfx('look'); }
  if (W8.syl !== prev.syl && W8.syl > 0) sfx('syl', W8.syl);
}
function renderRoster() {
  const l = [...roster.values()];
  $('#lCnt').textContent = `${l.length}명 입장`;
  $('#plist').innerHTML = l.map(p => `<button class="pc ${p.connected ? '' : 'off'}" data-id="${p.id}"><i style="background:${p.color}"></i>${esc(p.name)}</button>`).join('');
  const fin = l.filter(p => p.state === 'fin').length, out = l.filter(p => p.state === 'out').length;
  $('#hCnt').innerHTML = `통과 <b>${fin}</b> · 도전 중 <b>${l.length - fin - out}</b>${phase.mode === 'back' ? '' : ` · 탈락 <b>${out}</b>`}`;
}
$('#plist').onclick = (e) => { const b = e.target.closest('.pc'); if (b && confirm('이 학생을 내보낼까요?')) socket.emit('mg:kick', b.dataset.id); };
$('#bot10').onclick = () => socket.emit('mg:bots', 10);
$('#botClr').onclick = () => socket.emit('mg:clearbots');
$('#cfgBtn').onclick = $('#setBtn').onclick = () => { if (phase.phase === 'end') socket.emit('mg:reset'); $('#setup').classList.remove('hidden'); $('#openBtn').textContent = '이대로 적용'; };
$('#startBtn').onclick = () => { if (!roster.size) return alert('아직 들어온 학생이 없습니다.'); socket.emit('mg:start'); };
$('#againBtn').onclick = () => socket.emit('mg:reset');
$('#stopBtn').onclick = () => { if (confirm('지금 끝내고 결과를 볼까요?')) socket.emit('mg:stop'); };
$('#resetBtn').onclick = () => { if (confirm('대기실로 돌아갈까요?')) socket.emit('mg:reset'); };
$('#fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener('keydown', (e) => {
  if (e.code === 'Space' && phase.phase === 'lobby' && room && $('#setup').classList.contains('hidden')) { e.preventDefault(); $('#startBtn').click(); }
  if (e.code === 'Space' && phase.phase === 'end') { e.preventDefault(); socket.emit('mg:reset'); }
});

let bigTimer = 0;
function showBig(text, ms, color) {
  const b = $('#big'); b.textContent = text; b.style.color = color || '#fff'; b.classList.remove('hidden', 'pop'); void b.offsetWidth; b.classList.add('pop');
  clearTimeout(bigTimer); bigTimer = setTimeout(() => b.classList.add('hidden'), ms);
}
function countdown() {
  const step = () => { const left = Math.ceil((readyAtLocal - performance.now()) / 1000); if (phase.phase !== 'ready') return; if (left > 0) { showBig(left, 900); sfx('tick'); setTimeout(step, 1000); } };
  setTimeout(step, Math.max(0, (readyAtLocal - performance.now()) % 1000));
}
function showEnd() {
  const r = phase.result || { ranking: [] }; const rk = r.ranking;
  const fin = rk.filter(x => x.fin), out = rk.filter(x => !x.fin);
  $('#endTitle').textContent = fin.length ? `통과 ${fin.length}명!` : '아무도 통과하지 못했어요';
  const top = fin.slice(0, 3), order = [1, 0, 2].filter(i => top[i]);
  $('#podium').innerHTML = order.map(i => `<div class="pod r${i + 1}"><div class="nm">${esc(top[i].name)}</div><div class="blk">${i + 1}</div></div>`).join('');
  $('#finH').textContent = fin.length > 3 ? '통과 순서' : ''; $('#finL').innerHTML = fin.length > 3 ? fin.slice(3).map(x => `<span>${x.order}등 ${esc(x.name)}</span>`).join('') : '';
  $('#outH').textContent = out.length ? (phase.mode === 'back' ? '시간 안에 못 들어온 학생' : '탈락') : '';
  $('#outL').innerHTML = out.map(x => `<span>${esc(x.name)} · ${x.z}%${x.backs ? ` · ${x.backs}번 잡힘` : ''}</span>`).join('');
  sfx('win');
}

/* ═════════ 그리기 ═════════ */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

  if (W8.main === 'look') {
    const a = 0.75 + Math.sin(t * 10) * 0.25; ctx.fillStyle = `rgba(226,54,79,${a})`;
    ctx.font = `900 ${H * 0.09}px Pretendard,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = H * 0.008;
    for (const mx of [W * 0.2, W * 0.8]) { ctx.strokeText('멈춰!', mx, HZ * 0.55); ctx.fillText('멈춰!', mx, HZ * 0.55); }
  }
}
let sylT0 = 0;

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; const t = now / 1000;
  HZ = H * 0.27; Y0 = H * 0.86; HW = W * 0.33;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  IQ.drawWater(ctx, W, H, t);
  sky(t);
  track(t);
  // 술래들
  const [px, py, ps] = P(1.22, -0.55); palm(px, py, H * 0.2, t);
  const [ox, oy, os] = P(1.16, 0); octo(ox, oy, H * 0.3, t);
  const [kx, ky] = P(0.82, 1.55); crab(kx, ky, H * 0.085, t);
  // 학생들
  const k = 1 - Math.exp(-dt * 12);
  const list = [];
  for (const [id, e] of players) {
    const info = roster.get(id); if (!info) continue;
    if (e.sb && e.sb.length) { const q = IQ.sampleBuf(e.sb); e.dz = q.a.z + (q.c.z - q.a.z) * q.u; }
    if (e.out && !fx.some(f => f.id === id && f.type === 'fall')) continue;
    list.push([id, e, info]);
  }
  list.sort((a, b) => b[1].dz - a[1].dz);
  const base = H * 0.055;
  for (const [id, e, info] of list) {
    let z = e.dz, x = e.x, opts = {};
    if (e.fin) { z = 1.04 + (info.order % 4) * 0.012; opts.badge = String(info.order); }
    const f = fx.find(f => f.id === id && f.type === 'fall');
    if (f) { const u = (now - f.t0) / 1000; if (u > 1.6) continue; const side = x < 0 ? -1 : 1; x = f.x + side * Math.min(1, u / 0.9) * 0.9; z = f.z; opts.rot = side * Math.min(1, u / 0.6) * 1.4; opts.alpha = Math.max(0, 1 - Math.max(0, u - 0.9) / 0.6); }
    const [sx, sy, s] = P(z, x);
    let lift = 0; if (f) { const u = (now - f.t0) / 1000; lift = Math.sin(Math.min(1, u / 0.9) * Math.PI) * base * s * 2; }
    if (e.fin) lift = Math.abs(Math.sin(t * 6 + id.length)) * base * s * 0.4;
    runner(sx, sy - lift, base * s, info.color, t + (IQ.hash(id) % 100) / 10, (e.run && !e.fin) || (e.fin && false), info.name, opts);
    if (f && (now - f.t0) < 1100) bubble(sx, sy - base * s * 3.3 - lift, '잡았다!', '#e2364f', base * s * 0.55);
  }
  // 연출
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i], u = (now - f.t0) / 1000;
    if (f.type === 'poof') {
      if (u > 1.2) { fx.splice(i, 1); continue; }
      const [sx, sy, s] = P(f.z, f.x), r = base * s * (0.8 + u * 2);
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 0.8 - u)})`; for (let j = 0; j < 6; j++) { const a = j / 6 * Math.PI * 2; ctx.beginPath(); ctx.arc(sx + Math.cos(a) * r, sy - base * s + Math.sin(a) * r * 0.6, r * 0.5, 0, 7); ctx.fill(); }
      if (u < 1) bubble(sx, sy - base * s * 3, '처음으로!', '#f08a24', base * s * 0.55);
    } else if (f.type === 'fall') {
      if (u > 2.2) { fx.splice(i, 1); continue; }
      if (u > 0.9) { const side = f.x < 0 ? -1 : 1, [sx, sy, s] = P(f.z, f.x + side * 0.9), v = u - 0.9;
        ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, 1 - v)})`; ctx.lineWidth = 3; for (const m of [1, 0.6]) { ctx.beginPath(); ctx.ellipse(sx, sy, base * s * (0.5 + v * 2) * m, base * s * (0.15 + v * 0.6) * m, 0, 0, 7); ctx.stroke(); } }
    } else if (f.type === 'fin') { if (u > 1.5) fx.splice(i, 1); }
  }
  // 술래가 볼 때 화면 테두리 붉게
  if (W8.main === 'look' || W8.crab === 'look') {
    const a = 0.25 + Math.sin(t * 8) * 0.1, vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(226,54,79,0)'); vg.addColorStop(1, `rgba(226,54,79,${a})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (phase.phase === 'play' || phase.phase === 'ready' || phase.phase === 'lobby') chantHUD(t);
  if (phase.phase === 'play') { const left = Math.max(0, endsAtLocal - now) / 1000; $('#hTime').textContent = `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`; $('#hTime').style.background = left < 15 ? 'rgba(226,54,79,.9)' : ''; }
  else $('#hTime').textContent = `${Math.floor((phase.timeLimit || 120) / 60)}:${String((phase.timeLimit || 120) % 60).padStart(2, '0')}`;
}
requestAnimationFrame(frame);

/* ═════════ 소리 ═════════ */
let AC = null, muted = false;
$('#muteBtn').onclick = () => { muted = !muted; $('#muteBtn').textContent = muted ? '🔇' : '🔊'; };
document.addEventListener('pointerdown', () => { if (!AC) try { AC = new AudioContext(); } catch (e) {} }, { once: true });
function tone(f, d, type = 'triangle', v = 0.18, when = 0, slide) {
  if (muted) return; AC = AC || new AudioContext(); const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d);
}
const MEL = [392, 392, 440, 392, 330, 392, 440, 392, 330, 523];
function sfx(k, n) {
  try {
    if (k === 'syl') { sylT0 = performance.now(); tone(MEL[n - 1], 0.22, 'sine', 0.22); tone(MEL[n - 1] * 2, 0.12, 'triangle', 0.05); }
    if (k === 'turn') tone(700, 0.3, 'sawtooth', 0.06, 0, 180);
    if (k === 'look') { tone(110, 0.5, 'square', 0.12); tone(220, 0.25, 'square', 0.06, 0.05); }
    if (k === 'warn') { tone(1400, 0.05, 'square', 0.08); tone(1400, 0.05, 'square', 0.08, 0.12); tone(1400, 0.05, 'square', 0.08, 0.24); }
    if (k === 'buzz') tone(160, 0.45, 'sawtooth', 0.12);
    if (k === 'boing') tone(500, 0.35, 'sine', 0.15, 0, 150);
    if (k === 'fin') { tone(784, 0.12); tone(1046, 0.25, 'triangle', 0.18, 0.1); }
    if (k === 'tick') tone(880, 0.12, 'square', 0.07);
    if (k === 'lvup') [523, 659, 784].forEach((f, i) => tone(f, 0.18, 'triangle', 0.15, i * 0.1));
    if (k === 'win') [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.16, i * 0.13));
  } catch (e) {}
}
</script>
