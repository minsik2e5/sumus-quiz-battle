<style>
/* ===== G · 팝 스티커 — 인스타 스토리처럼 스티커를 붙인 화면 ===== */
.G { --lilac: #b9a7ff; --pink: #ff4fa3; --lime: #d4ff3a; --ink: #121212; --white: #ffffff; background: var(--lilac); color: var(--ink); font-family: "Pretendard", sans-serif; }
.G .dh { font-family: "Do Hyeon", sans-serif; font-weight: 400; }
.G .top { position: absolute; left: 18px; right: 18px; top: 18px; display: flex; justify-content: space-between; align-items: center; }
.G .pill { padding: 6px 12px; border-radius: 99px; background: var(--white); font-size: 14px; font-weight: 800; border: 2px solid var(--ink); }
.G .blob { position: absolute; left: 30px; top: 92px; width: 330px; height: 330px; border-radius: 46% 54% 42% 58% / 52% 44% 56% 48%; background: var(--white); border: 2.5px solid var(--ink); }
.G .pet { position: absolute; left: 34px; top: 84px; width: 330px; animation: g-bounce 520ms cubic-bezier(.3,1.5,.5,1) both; }
.G .stk { position: absolute; padding: 8px 14px; border: 2.5px solid var(--ink); font-size: 22px; line-height: 1; animation: g-stick 360ms cubic-bezier(.3,1.6,.5,1) both; }
.G .s1 { left: 16px; top: 96px; background: var(--lime); transform: rotate(-8deg); animation-delay: 200ms; }
.G .s2 { right: 14px; top: 300px; background: var(--pink); color: var(--white); transform: rotate(7deg); border-radius: 99px; animation-delay: 300ms; }
.G .s3 { left: 22px; top: 376px; background: var(--white); transform: rotate(4deg); font-size: 18px; animation-delay: 380ms; }
.G .s2 small, .G .s1 small { display: block; font-family: "Pretendard"; font-size: 11px; font-weight: 800; margin-bottom: 3px; }
.G h1 { position: absolute; left: 18px; right: 18px; top: 448px; font-size: 44px; line-height: 1.02; letter-spacing: -.01em; }
.G h1 span { background: var(--white); padding: 0 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; border: 2.5px solid var(--ink); }
.G .chips { position: absolute; left: 18px; right: 18px; top: 560px; display: flex; gap: 8px; flex-wrap: wrap; }
.G .chips a { padding: 10px 14px; border-radius: 16px; background: var(--white); border: 2.5px solid var(--ink); font-size: 15px; font-weight: 800; }
.G .chips a b { color: var(--pink); }
.g-go { position: absolute; left: 18px; right: 18px; bottom: 100px; height: 62px; display: grid; place-items: center; border-radius: 99px; background: #121212; color: #d4ff3a; font-family: "Do Hyeon", sans-serif; font-size: 26px; text-decoration: none; transition: transform 160ms cubic-bezier(.3,1.6,.5,1); }
.g-go:active, .g-go.press { transform: scale(.94) rotate(-2deg); }
.spec .g-go { position: static; }
.G .tabs { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 62px; border-radius: 99px; background: var(--white); border: 2.5px solid var(--ink); display: flex; justify-content: space-around; align-items: center; }
.G .tabs a { font-size: 14px; font-weight: 800; color: #6b6b6b; padding: 8px 10px; border-radius: 99px; }
.G .tabs a.on { background: var(--lime); color: var(--ink); }
@keyframes g-bounce { from { transform: scale(.7) translateY(30px); opacity: 0; } }
@keyframes g-stick { from { transform: scale(1.6) rotate(-20deg); opacity: 0; } }
</style>
</head>
