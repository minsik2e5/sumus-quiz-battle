<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>몬스터 1 · 하늘 모험</title>
<link rel="stylesheet" href="../mock.css">
<link rel="stylesheet" href="base.css">
<style>
/* ===== 1 · 하늘 모험 — 맑은 하늘 · 풀빛 언덕 · 도톰한 둥근 판 ===== */
.M1 { --sky: #5ab8ff; --sky2: #c9ecff; --grass: #48c46a; --grass2: #2f9a50; --cream: #fffaf0; --ink: #1d2a44; --sun: #ffbf2e; --sun2: #e0920a;
  background: linear-gradient(180deg, var(--sky) 0%, var(--sky2) 52%, #eaf8ff 70%); color: var(--ink); font-family: "Pretendard", sans-serif; }
.M1 .ju { font-family: "Jua", sans-serif; font-weight: 400; }
.M1 .cloud { position: absolute; height: 26px; border-radius: 99px; background: #fff; opacity: .9; }
.M1 .cloud::before, .M1 .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.M1 .cloud::before { width: 34px; height: 34px; left: 14px; top: -16px; } .M1 .cloud::after { width: 26px; height: 26px; left: 40px; top: -10px; }
.M1 .c1 { left: 24px; top: 92px; width: 86px; animation: m1-drift 1600ms ease-out both; } .M1 .c2 { right: 30px; top: 132px; width: 70px; animation: m1-drift 1600ms 100ms ease-out both; }
.M1 .top { position: absolute; left: 14px; right: 14px; top: 16px; display: flex; justify-content: space-between; }
.M1 .pill { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 5px; border-radius: 99px; background: var(--cream); box-shadow: 0 3px 0 rgba(29,42,68,.18); font-size: 14px; font-weight: 800; }
.M1 .pill .av { width: 30px; height: 30px; border-radius: 50%; background: var(--sky); color: #fff; display: grid; place-items: center; font-size: 13px; }
.M1 .pill img { width: 22px; height: 22px; }
.M1 .pill.c { padding: 0 14px 0 10px; }
.M1 .hill { position: absolute; left: -60px; right: -60px; top: 370px; height: 260px; border-radius: 50% 50% 0 0 / 70px 70px 0 0; background: linear-gradient(var(--grass), var(--grass2)); }
.M1 .hill::before { content: ""; position: absolute; left: 50%; top: 24px; width: 190px; height: 34px; margin-left: -95px; border-radius: 50%; background: rgba(0,0,0,.14); }
.M1 .pet { position: absolute; left: 50%; top: 150px; width: 280px; margin-left: -140px; animation: m1-hop 640ms cubic-bezier(.3,1.5,.5,1) both; }
.M1 .care { position: absolute; top: 300px; width: 74px; text-align: center; font-size: 12px; font-weight: 800; color: var(--ink); animation: m1-pop 360ms 300ms cubic-bezier(.3,1.6,.5,1) both; }
.M1 .care.l { left: 14px; } .M1 .care.r { right: 14px; }
.M1 .care i { display: grid; place-items: center; width: 62px; height: 62px; margin: 0 auto 4px; border-radius: 50%; background: var(--cream); box-shadow: 0 4px 0 rgba(29,42,68,.2), inset 0 0 0 3px #fff; }
.M1 .care img { width: 42px; height: 42px; }
.M1 .care b { color: var(--grass2); }
.M1 .name { position: absolute; left: 50%; top: 108px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border-radius: 99px; background: var(--cream); box-shadow: 0 3px 0 rgba(29,42,68,.18); white-space: nowrap; }
.M1 .name b { font-family: "Jua"; font-weight: 400; font-size: 20px; margin-right: 2px; }
.M1 .sheet { position: absolute; left: 10px; right: 10px; top: 440px; bottom: 90px; border-radius: 28px; background: var(--cream); box-shadow: 0 5px 0 rgba(29,42,68,.18); padding: 16px 16px 0; animation: m1-up 420ms cubic-bezier(0,0,.15,1) both; }
.M1 .xp { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; }
.M1 .xp .bar { flex: 1; height: 14px; border-radius: 99px; background: #e8eef7; box-shadow: inset 0 2px 0 rgba(0,0,0,.06); overflow: hidden; }
.M1 .xp .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(#7ee08f, var(--grass)); transform-origin: left; transform: scaleX(.6); animation: m1-fill 800ms 300ms cubic-bezier(.03,.4,.1,1) both; }
.m1-go { display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; margin-top: 14px; border-radius: 22px; background: linear-gradient(#ffd25c, #ffbf2e); color: #1d2a44; font-family: "Jua", sans-serif; font-size: 25px; text-decoration: none; box-shadow: 0 6px 0 #e0920a, inset 0 2px 0 rgba(255,255,255,.6); transition: transform 90ms, box-shadow 90ms; }
.m1-go small { font-family: "Pretendard"; font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 99px; background: rgba(29,42,68,.12); }
.m1-go:active, .m1-go.press { transform: translateY(5px); box-shadow: 0 1px 0 #e0920a, inset 0 2px 0 rgba(255,255,255,.6); }
.M1 .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.M1 .grid a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 8px; border-radius: 18px; background: #fff; box-shadow: 0 3px 0 rgba(29,42,68,.12), inset 0 0 0 2px #edf1f7; font-size: 13px; font-weight: 800; }
.M1 .grid img { width: 38px; height: 38px; }
.M1 .grid small { font-size: 11.5px; color: #5d6a85; font-weight: 700; }
.M1 .stat3 { display: flex; justify-content: space-between; margin-top: 16px; padding: 12px 14px; border-radius: 16px; background: #eef7ff; font-size: 13px; font-weight: 700; color: #5d6a85; }
.M1 .stat3 b { color: var(--ink); font-weight: 900; }
.M1 .tabs { position: absolute; left: 10px; right: 10px; bottom: 12px; height: 66px; border-radius: 24px; background: var(--ink); display: flex; justify-content: space-around; align-items: center; }
.M1 .tabs a { font-family: "Jua"; font-size: 15px; color: rgba(255,255,255,.55); padding: 8px 10px; border-radius: 16px; }
.M1 .tabs a.on { background: var(--sun); color: var(--ink); }

/* 공부: 야생 단어 몬스터와 마주침 */
.M1 .field { position: absolute; left: 0; right: 0; top: 0; height: 520px; background: linear-gradient(180deg, var(--sky) 0%, var(--sky2) 60%, #d6f5c9 60%, #9fe0a0 100%); }
.M1 .pad { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, #6fd08a 0 55%, #4fb46c 56% 100%); }
.M1 .pad.op { right: 18px; top: 236px; width: 190px; height: 50px; } .M1 .pad.me { left: 6px; top: 440px; width: 210px; height: 56px; }
.M1 .mon { position: absolute; right: 30px; top: 92px; width: 170px; animation: m1-hit 520ms 500ms both; }
.M1 .mine { position: absolute; left: 10px; top: 268px; width: 210px; transform: scaleX(-1); animation: m1-in 520ms cubic-bezier(.03,.4,.1,1) both; }
.M1 .plate { position: absolute; padding: 10px 12px; border-radius: 16px; background: var(--cream); box-shadow: 0 4px 0 rgba(29,42,68,.18); width: 178px; }
.M1 .plate .nm { display: flex; justify-content: space-between; align-items: baseline; font-family: "Jua"; font-size: 17px; }
.M1 .plate .nm small { font-family: "Pretendard"; font-size: 12px; font-weight: 800; color: #5d6a85; }
.M1 .plate .hp { margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 900; color: #5d6a85; }
.M1 .plate .hp div { flex: 1; height: 10px; border-radius: 99px; background: #e3e8f0; overflow: hidden; }
.M1 .plate .hp i { display: block; height: 100%; border-radius: 99px; background: var(--grass); transform-origin: left; }
.M1 .plate.op { left: 14px; top: 70px; } .M1 .plate.op .hp i { background: #f29a0c; transform: scaleX(.35); animation: m1-drain 700ms 560ms cubic-bezier(.03,.4,.1,1) both; }
.M1 .plate.me { right: 14px; top: 360px; } .M1 .plate.me .hp i { transform: scaleX(.82); }
.M1 .dmg { position: absolute; right: 96px; top: 96px; font-family: "Jua"; font-size: 34px; color: #f0553a; -webkit-text-stroke: 5px #fff; paint-order: stroke fill; animation: m1-dmg 800ms 560ms both; }
.M1 .say { position: absolute; left: 10px; right: 10px; top: 506px; padding: 14px 16px; border-radius: 22px; background: var(--cream); box-shadow: 0 5px 0 rgba(29,42,68,.18); }
.M1 .say p { font-size: 15px; font-weight: 700; line-height: 1.4; }
.M1 .say p b { font-family: "Jua"; font-weight: 400; font-size: 19px; color: var(--grass2); }
.M1 .ans { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.M1 .ans a { height: 52px; border-radius: 16px; display: grid; place-items: center; background: #fff; box-shadow: 0 4px 0 rgba(29,42,68,.14), inset 0 0 0 2px #edf1f7; font-size: 15px; font-weight: 800; }
.M1 .ans a.ok { background: var(--grass); color: #fff; box-shadow: 0 4px 0 var(--grass2); }
.M1 .ans a.dim { opacity: .5; }
.M1 .prog { position: absolute; left: 14px; right: 14px; top: 18px; display: flex; gap: 4px; }
.M1 .prog i { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,255,255,.55); } .M1 .prog i.f { background: #fff; }
.M1 .tag { position: absolute; left: 14px; top: 34px; font-family: "Jua"; font-size: 16px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.18); }

@keyframes m1-hop { 0% { transform: translateY(40px) scale(.8); opacity: 0; } 60% { transform: translateY(-10px); opacity: 1; } 100% { transform: none; } }
@keyframes m1-pop { from { transform: scale(.4); opacity: 0; } }
@keyframes m1-up { from { transform: translateY(60px); } }
@keyframes m1-fill { from { transform: scaleX(0); } }
@keyframes m1-drift { from { transform: translateX(-30px); opacity: 0; } }
@keyframes m1-in { from { transform: scaleX(-1) translateX(60px); opacity: 0; } }
@keyframes m1-hit { 0%, 100% { transform: none; } 20% { transform: translateX(10px); opacity: .4; } 40% { transform: translateX(-8px); opacity: 1; } 60% { transform: translateX(5px); opacity: .5; } 80% { opacity: 1; } }
@keyframes m1-drain { from { transform: scaleX(.8); } }
@keyframes m1-dmg { 0% { transform: translateY(10px) scale(.5); opacity: 0; } 30% { transform: translateY(-6px) scale(1.15); opacity: 1; } 100% { transform: translateY(-20px); opacity: 1; } }
</style>
</head>
