.e-go { position: absolute; left: 40px; right: 40px; bottom: 112px; height: 58px; display: grid; place-items: center; color: #0b1020; background: linear-gradient(180deg, #f3dea6, #d9b56a); font-family: "Song Myung"; font-size: 21px; text-decoration: none; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); transition: transform 140ms cubic-bezier(0,0,.15,1), filter 140ms; }

.E .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; padding: 0 18px 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(217,181,106,.3); background: rgba(11,16,32,.92); }
