<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sweet Survival · Student</title><link rel="stylesheet" href="/styles.css"></head><body><main id="joinPage" class="page join"><div class="card"><div class="title">🐰 Sweet Survival</div><p class="muted">방 코드와 이름을 입력하세요.</p><label class="small muted">ROOM CODE</label><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="6자리 코드"><label class="small muted" style="display:block;margin-top:12px">NAME</label><input id="nameInput" maxlength="16" placeholder="이름"><button id="joinBtn" class="btn primary" style="width:100%;margin-top:14px">입장하기</button><div id="joinError" class="small red" style="margin-top:10px"></div></div></main><main id="lobbyPage" class="page join hidden"><div class="card"><div class="row between"><div><div class="small muted">ROOM</div><div class="code" id="studentCode">------</div></div><span class="pill" id="studentConn">CONNECTED</span></div><h2 id="studentName"></h2><p class="muted" id="lobbySummary">교사의 시작을 기다립니다.</p><button id="readyBtn" class="btn primary" style="width:100%">READY</button></div></main><main id="gamePage" class="page game-page hidden"><div class="topline row between" style="margin-bottom:8px"><div><b id="gameName">학생</b> · <span class="muted" id="gameRoom"></span></div><span class="pill" id="gameNet">LIVE</span></div><div class="game-shell" id="gameShell"><div id="view" style="width:100%;height:100%;min-height:360px"></div><div class="hud"><div class="time" id="time">0.00</div><div id="stage">STAGE 1</div><div id="aliveHud" style="font-size:12px;margin-top:2px">0 / 0 ALIVE</div></div><div id="countdown" class="center-overlay hidden"><div><div style="font-size:64px;font-weight:1000" id="countText">3</div><div class="small">GET READY!</div></div></div><div id="warning" class="warning hidden"><div class="box"><div class="small" style="letter-spacing:.25em">WATCH OUT!</div><div class="name" id="warningName">CANDY SWEEP</div><div class="small">경고 후 공격 시작</div></div></div><div id="dead" class="center-overlay hidden" style="pointer-events:auto"><div><div style="font-size:54px">💫</div><div style="font-size:34px;font-weight:1000">BONK!</div><div id="deadResult" style="margin-top:6px"></div><div class="small" style="margin-top:8px">다른 친구들의 경기가 끝날 때까지 기다려요.</div></div></div><div id="paused" class="center-overlay hidden"><div style="font-size:34px;font-weight:1000">PAUSED</div></div><div class="controls"><div><div id="joy" class="joy"><div id="knob" class="knob"></div></div></div><div><button id="jump" class="jump">JUMP!</button></div></div></div></main><script type="module" src="/student.js"></script></body></html>
