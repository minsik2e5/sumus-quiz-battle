<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sweet Survival · Teacher</title><link rel="stylesheet" href="/styles.css"></head><body><main class="page"><div class="row between"><div><div class="title">🍭 SWEET SURVIVAL · CONTROL CENTER</div><div class="small muted">V0.10 · 실제 20인 SSE 서버</div></div><span class="pill" id="serverStatus">서버 연결 중…</span></div><div class="teacher-layout" style="margin-top:14px"><section class="card"><div class="row between"><div><div class="small muted">ROOM CODE</div><div class="code" id="code">------</div></div><div><canvas id="qr" class="qr hidden" width="220" height="220" aria-label="학생 입장 QR"></canvas></div></div><div class="small muted" id="joinUrl" style="word-break:break-all;margin-top:8px"></div><div class="row" style="margin:14px 0"><button class="btn primary" id="start" disabled>START</button><button class="btn" id="pause" disabled>PAUSE</button><button class="btn" id="restart" disabled>NEW ROUND</button></div><div class="row"><span class="pill" id="connected">0 / 20 CONNECTED</span><span class="pill" id="readyCount">0 READY</span><span class="pill" id="alive">— ALIVE</span><span class="pill" id="roundTime">0.00 s</span></div><div id="players" class="grid players" style="margin-top:14px"></div></section><aside class="card"><div class="title" style="font-size:17px">LIVE RANKING</div><div id="ranking" style="margin-top:8px"></div></aside></div><section class="projector" style="margin-top:14px"><div><div class="small" style="letter-spacing:.25em;opacity:.7" id="projKick">WAITING ROOM</div><div class="big" id="projMain">0 / 20</div><div style="opacity:.72" id="projSub">학생들이 QR로 입장합니다.</div></div></section></main><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="/teacher.js"></script></body></html>
